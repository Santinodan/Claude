# Proyecto de Xcode de Frutilla Finanzas.
# No editar FrutillaFinanzas.xcodeproj a mano: se genera con XcodeGen a partir de este archivo.
#   ./generar_proyecto.sh   (o `xcodegen generate`)
name: FrutillaFinanzas

options:
  bundleIdPrefix: com.soul
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  FrutillaFinanzas:
    type: application
    platform: iOS
    sources:
      - path: FrutillaFinanzas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soul.frutillafinanzas
        PRODUCT_NAME: FrutillaFinanzas
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Frutilla Finanzas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

  FrutillaFinanzasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FrutillaFinanzasTests
    dependencies:
      - target: FrutillaFinanzas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soul.frutillafinanzas.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  FrutillaFinanzas:
    build:
      targets:
        FrutillaFinanzas: all
        FrutillaFinanzasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - FrutillaFinanzasTests
    archive:
      config: Release
