<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala de Color</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sala de color: visor grande sobre gris neutro (para juzgar color sin sesgo), panel de controles a la derecha. Un solo tema oscuro a proposito. */
:root{
  --bg:#141517;        /* gris neutro de sala de color */
  --panel:#1c1d20;
  --line:#2c2e33;
  --fg:#e7e6e3;
  --muted:#8d9097;
  --accent:#ff4433;    /* rojo neon de los titulos de referencia */
  --accent-soft:rgba(255,68,51,.14);
  --ok:#5fd39a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:grid;gap:14px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1;color:var(--fg)}
h1 b{color:var(--accent);font-weight:800;text-shadow:0 0 18px rgba(255,68,51,.45)}
header p{margin:0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}

/* visor */
.viewer{display:grid;gap:8px;min-width:0}
.stage{position:relative;background:#000;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:1px solid var(--line);touch-action:none;cursor:ew-resize;user-select:none}
.stage canvas{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;background:#000;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
.split{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.split::after{content:"";position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.tag{position:absolute;top:10px;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.6);color:var(--fg);padding:3px 7px;pointer-events:none}
.tag.l{left:10px}.tag.r{right:10px}
.vrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font:12px var(--f-mono)}
.vrow input[type=range]{flex:1;min-width:140px}
.drop{border:1px dashed var(--line);padding:10px 12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}

/* panel */
aside{background:var(--panel);border:1px solid var(--line);display:grid;min-width:0}
section{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
section:last-child{border-bottom:0}
h2{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px}
h2 span{font-family:var(--f-mono);letter-spacing:0;text-transform:none;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--f-body);background:transparent;color:var(--fg);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.luts{display:grid;gap:4px}
.lut{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;text-align:left;background:transparent;border:1px solid transparent;color:var(--fg);padding:7px 8px;cursor:pointer;font:13px var(--f-body)}
.lut:hover{border-color:var(--line)}
.lut[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lut i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lut[aria-pressed=true] i{background:var(--accent)}
.lut small{color:var(--muted);font:11px var(--f-mono)}
.lut.err small{color:var(--accent)}
.big{font:800 40px var(--f-display);line-height:1;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],textarea,select{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:7px 9px;font:13px var(--f-body);width:100%;box-sizing:border-box}
textarea{min-height:56px;resize:vertical}
button.btn{font:600 13px var(--f-body);background:var(--fg);color:var(--bg);border:0;padding:9px 12px;cursor:pointer}
button.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.link{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 8px;display:inline-flex;gap:6px;align-items:center}
.link::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.link[data-on="1"]{color:var(--ok);border-color:rgba(95,211,154,.35)}
.link[data-on="1"]::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.btn.save{width:100%;padding:11px 12px;background:var(--accent);color:#fff}
.btn.save:disabled{background:var(--line);color:var(--muted);cursor:default}
.looks{display:grid;gap:6px}
.look{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--bg);border:1px solid var(--line);color:var(--fg);padding:9px 10px;cursor:pointer;font:13px var(--f-body)}
.look[aria-current=true]{border-color:var(--fg)}
.look b{font:800 18px var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.look span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look em{font:normal 11px var(--f-mono);color:var(--muted)}
.look em.ok{color:var(--ok)}.look em.pend{color:var(--accent)}
pre{margin:0;background:var(--bg);border:1px solid var(--line);padding:10px;font:11.5px/1.5 var(--f-mono);color:var(--fg);overflow-x:auto;white-space:pre;max-height:220px}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{font:12px var(--f-mono);color:var(--ok);min-height:1em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Sala de <b>Color</b></h1>
    <span class="link" id="link" data-on="0">Solo en este navegador</span>
  </header>

  <div class="grid">
    <div class="viewer">
      <div class="stage" id="stage">
        <canvas id="cv" width="1280" height="720"></canvas>
        <div class="bar top" id="barT"></div><div class="bar bot" id="barB"></div>
        <div class="split" id="split"></div>
        <span class="tag l">Antes</span><span class="tag r" id="tagR">Después</span>
      </div>
      <div class="vrow" id="vidRow" hidden>
        <button class="chip" id="play" type="button">▶</button>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Elegir fotograma">
        <span id="tc">00:00</span>
      </div>
      <div class="drop" id="drop">
        <span>Arrastrá acá un clip o una imagen, o</span>
        <button class="btn sec" type="button" id="pickSrc">Elegir archivo</button>
        <input type="file" id="srcFile" accept="image/*,video/*">
        <span id="srcName" class="note">Ejemplo: carta de color en D-Log</span>
      </div>
    </div>

    <aside>
      <section>
        <h2>Perfil del material</h2>
        <div class="chips" id="perfiles"></div>
      </section>
      <section>
        <h2>LUT <span id="lutName">–</span></h2>
        <div class="luts" id="luts"></div>
        <div class="row">
          <button class="btn sec" type="button" id="pickLut">Cargar .cube</button>
          <input type="file" id="lutFile" accept=".cube" multiple>
        </div>
      </section>
      <section>
        <h2>Intensidad</h2>
        <div class="big" id="pct">100%</div>
        <input type="range" id="amt" min="0" max="100" value="100" aria-label="Intensidad de la LUT">
        <button class="btn save" type="button" id="saveLook">Usar este look</button>
        <div class="toast" id="toast" role="status"></div>
      </section>
      <section>
        <h2>Barras</h2>
        <select id="barras" aria-label="Barras negras">
          <option value="0">Sin barras</option>
          <option value="2">Finas · 2:1</option>
          <option value="2.22">Medias · 2.22:1 (como Brez)</option>
          <option value="2.39">Cine · 2.39:1</option>
        </select>
        <select id="barrasDonde" aria-label="Dónde van las barras">
          <option value="todo">En todo el video</option>
          <option value="montajes">Solo en montajes con música</option>
        </select>
      </section>
      <section>
        <h2>Looks del vlog</h2>
        <div class="looks" id="looks"></div>
        <p class="note">Tocá un perfil para revisarlo. Lo que guardes es lo que Claude usa al editar.</p>
      </section>
    </aside>
  </div>
</div>

const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k);
const texImg=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texImg);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
const texLut=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,texLut);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.LINEAR));
[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T,gl.TEXTURE_WRAP_R].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.CLAMP_TO_EDGE));
gl.uniform1i(U("img"),0);gl.uniform1i(U("lut"),1);
let lutN=0;

function parseCube(txt){let n=0;const v=[];
  for(const line of txt.split(/\r?\n/)){const s=line.trim();if(!s||s[0]=="#")continue;
    if(/^LUT_3D_SIZE/i.test(s)){n=parseInt(s.split(/\s+/)[1]);continue}
    if(/^[A-Z_]/i.test(s))continue;
    const p=s.split(/\s+/);if(p.length>=3){v.push(+p[0],+p[1],+p[2],1)}}
  if(!n||v.length!==n*n*n*4)throw new Error("El .cube no es una LUT 3D válida");
  return{n,data:new Float32Array(v)}}
function useLut(l){gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,texLut);
  gl.texImage3D(gl.TEXTURE_3D,0,gl.RGBA16F,l.n,l.n,l.n,0,gl.RGBA,gl.FLOAT,l.data);lutN=l.n;draw()}

function setSource(el,w,h){srcEl=el;cv.width=w;cv.height=h;$("stage").style.aspectRatio=w+"/"+h;upload();layoutBars()}
function upload(){if(!srcEl)return;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texImg);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcEl);draw()}
function draw(){gl.viewport(0,0,cv.width,cv.height);
  gl.uniform1f(U("n"),lutN||1);gl.uniform1f(U("amt"),st.eleccion[st.perfil]?.intensidad/100??1);
  gl.uniform1f(U("split"),split);gl.uniform1f(U("has"),lutN&&cur()?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  $("split").style.left=`calc(${split*100}% - 1px)`}

/* ---------- LUTs ---------- */
function cur(){return st.eleccion[st.perfil]?.lut}
async function getLut(def){if(cache[def.id])return cache[def.id];
  for(const url of (location.protocol==="http:"?[def.custom, encodeURI(REPO+def.repo), "luts/"+def.file]:[def.custom, "luts/"+def.file, encodeURI(REPO+def.repo)]).filter(Boolean)){
    try{const r=await fetch(url);if(r.ok){const l=parseCube(await r.text());cache[def.id]=l;return l}}catch(e){}}
  throw new Error("no encontrada")}
const custom=[];
function renderLuts(){const box=$("luts");box.innerHTML="";
  const list=[...LUTS,...custom].filter(l=>l.perfil===st.perfil||l.perfil==="todos");
  const ninguna={id:"",name:"Sin LUT (original)"};
  for(const l of [ninguna,...list]){const b=document.createElement("button");b.type="button";b.className="lut";
    b.setAttribute("aria-pressed",String((cur()||"")===l.id));
    b.innerHTML=`<i></i><span>${l.name}</span><small>${l.file||""}</small>`;
    b.onclick=()=>pick(l,b);box.appendChild(b)}
  $("lutName").textContent=([...LUTS,...custom].find(l=>l.id===cur())||{}).file||"ninguna"}
async function pick(l,b){const e=st.eleccion[st.perfil]||{intensidad:100};
  if(!l.id){st.eleccion[st.perfil]={...e,lut:""};lutN=0;save();renderLuts();draw();return}
  try{useLut(await getLut(l));st.eleccion[st.perfil]={...e,lut:l.id};save();renderLuts()}
  catch(err){b.classList.add("err");b.querySelector("small").textContent="no se pudo leer · cargala con “Cargar .cube”"}}
async function restoreLut(){const id=cur();lutN=0;
  const l=[...LUTS,...custom].find(x=>x.id===id);if(l){try{useLut(await getLut(l))}catch(e){}}
  $("amt").value=st.eleccion[st.perfil]?.intensidad??100;$("pct").textContent=$("amt").value+"%";renderLuts();draw()}

/* ---------- UI ---------- */
function renderPerfiles(){const box=$("perfiles");box.innerHTML="";
  for(const[k,v]of PERFILES){const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=v;
    b.setAttribute("aria-pressed",String(st.perfil===k));b.onclick=()=>{st.perfil=k;save();renderPerfiles();restoreLut()};box.appendChild(b)}}
function layoutBars(){const r=parseFloat(st.barras);const ar=cv.width/cv.height;
  const h=r&&r>ar?(1-ar/r)/2*100:0;$("barT").style.height=$("barB").style.height=h+"%"}
function save(){store.set({...st,saved:db?undefined:saved});renderLooks()}

const stage=$("stage");
function moveSplit(e){const r=stage.getBoundingClientRect();split=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));draw()}
stage.addEventListener("pointerdown",e=>{stage.setPointerCapture(e.pointerId);moveSplit(e)});
stage.addEventListener("pointermove",e=>{if(e.buttons)moveSplit(e)});
stage.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"){split=Math.max(0,split-.05);draw()}if(e.key==="ArrowRight"){split=Math.min(1,split+.05);draw()}});
stage.tabIndex=0;stage.setAttribute("aria-label","Comparador antes y después. Flechas para mover la línea.");

$("amt").oninput=e=>{const v=+e.target.value;$("pct").textContent=v+"%";
  st.eleccion[st.perfil]={...(st.eleccion[st.perfil]||{lut:""}),intensidad:v};save();draw()};
$("barras").value=st.barras;$("barrasDonde").value=st.barrasDonde;
$("barras").onchange=e=>{st.barras=e.target.value;save();layoutBars();saveBarras()};
$("barrasDonde").onchange=e=>{st.barrasDonde=e.target.value;save();saveBarras()};

function loadFile(f){if(!f)return;$("srcName").textContent=f.name;const url=URL.createObjectURL(f);
  if(f.type.startsWith("video")){video=document.createElement("video");video.muted=true;video.playsInline=true;video.src=url;
    video.onloadeddata=()=>{setSource(video,video.videoWidth,video.videoHeight);$("vidRow").hidden=false};
    video.onerror=()=>{$("srcName").textContent=f.name+" · el navegador no puede leer este video (H.265 10-bit suele fallar). Subí una captura.";};
    video.onseeked=upload;video.ontimeupdate=()=>{if(!video.paused){upload();}$("seek").value=video.currentTime/video.duration*1000||0;
      const t=video.currentTime;$("tc").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0")};
  }else{const im=new Image();im.onload=()=>{$("vidRow").hidden=true;video=null;setSource(im,im.naturalWidth,im.naturalHeight)};im.src=url}}
$("seek").oninput=e=>{if(video)video.currentTime=e.target.value/1000*video.duration};
$("play").onclick=()=>{if(!video)return;if(video.paused){video.play();$("play").textContent="❚❚";(function loop(){if(video&&!video.paused){upload();requestAnimationFrame(loop)}})()}else{video.pause();$("play").textContent="▶"}};
$("pickSrc").onclick=()=>$("srcFile").click();$("srcFile").onchange=e=>loadFile(e.target.files[0]);
const drop=$("drop");
["dragenter","dragover"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add("on")}));
["dragleave","drop"].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("on")}));
document.addEventListener("drop",e=>{const fs=[...e.dataTransfer.files];const cubes=fs.filter(f=>/\.cube$/i.test(f.name));
  if(cubes.length)addCubes(cubes);const m=fs.find(f=>/^(image|video)\//.test(f.type));if(m)loadFile(m)});

async function addCubes(files){for(const f of files){try{const l=parseCube(await f.text());const id="c_"+f.name;
  cache[id]=l;if(!custom.find(c=>c.id===id))custom.push({id,name:f.name.replace(/\.cube$/i,"").replace(/_/g," "),perfil:"todos",file:f.name,custom:null});
  const def=custom.find(c=>c.id===id);useLut(l);st.eleccion[st.perfil]={...(st.eleccion[st.perfil]||{intensidad:100}),lut:id};save();renderLuts()}
  catch(err){toast(f.name+": "+err.message)}}}
$("pickLut").onclick=()=>$("lutFile").click();$("lutFile").onchange=e=>addCubes([...e.target.files]);

function toast(t){$("toast").textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").textContent="",3000)}
/* ---------- looks guardados: los lee Claude ---------- */
const allLuts=()=>[...LUTS,...custom];
function lutLabel(id){const l=allLuts().find(x=>x.id===id);return l?l.name:"Sin LUT"}
function same(a,b){return !!(a&&b)&&(a.lut||"")===(b.lut||"")&&(a.intensidad??100)===(b.intensidad??100)}
function renderLooks(){const box=$("looks");if(!box)return;box.innerHTML="";
  for(const[k,v]of PERFILES){const sv=saved[k], e=st.eleccion[k];
    const b=document.createElement("button");b.type="button";b.className="look";b.setAttribute("aria-current",String(st.perfil===k));
    let estado="sin elegir", cls="";
    if(sv&&same(sv,e)){estado="guardado";cls="ok"}else if(sv){estado="sin guardar";cls="pend"}else if(e&&e.lut){estado="sin guardar";cls="pend"}
    const show=e&&e.lut?e:sv;
    b.innerHTML=`<b>${v}</b><span>${show&&show.lut?lutLabel(show.lut)+" · "+(show.intensidad??100)+"%":"–"}</span><em class="${cls}">${estado}</em>`;
    b.onclick=()=>{st.perfil=k;save();renderPerfiles();restoreLut()};box.appendChild(b)}
  const e=st.eleccion[st.perfil], btn=$("saveLook"), ok=same(saved[st.perfil],e);
  btn.disabled=!(e&&e.lut)||ok;
  btn.textContent=ok?"Look guardado":"Usar este look para "+PERFILES.find(p=>p[0]===st.perfil)[1]}
$("saveLook").onclick=async()=>{const e=st.eleccion[st.perfil];if(!e||!e.lut)return;
  const l=allLuts().find(x=>x.id===e.lut)||{};
  const body={perfil:st.perfil,lut:e.lut,lutArchivo:l.repo?"Powergrade/"+l.repo:(l.file||e.lut),lutNombre:lutLabel(e.lut),intensidad:e.intensidad??100,guardado:new Date().toISOString()};
  if(!db){saved[st.perfil]=body;save();toast("Guardado en este navegador");return}
  $("saveLook").disabled=true;
  try{await db.doc("looks/"+st.perfil).set(body);toast("Guardado. Claude ya lo ve.")}
  catch(err){toast(err&&err.code==="invalid_argument"?"No tenés permiso para guardar en esta app":"No se pudo guardar, probá de nuevo");renderLooks()}};
let barrasT;
function saveBarras(){if(!db)return;clearTimeout(barrasT);barrasT=setTimeout(()=>{
  db.doc("ajustes/barras").set({formato:st.barras==="0"?null:st.barras+":1",donde:st.barrasDonde,guardado:new Date().toISOString()})
    .then(()=>toast("Barras guardadas")).catch(()=>{})},600)}
(async()=>{renderLooks();
  if(!window.claude||!window.claude.use)return;
  db=await window.claude.use("db");if(!db)return;
  const L=$("link");L.dataset.on="1";L.textContent="Conectado con Claude";
  db.collection("looks").onSnapshot(q=>{saved={};q.docs.forEach(d=>{saved[d.id]=d.data()});renderLooks()},()=>{L.dataset.on="0";L.textContent="Sin conexión con Claude"});
  db.doc("ajustes/barras").get().then(d=>{if(d.exists){const v=d.data();st.barras=v.formato?String(parseFloat(v.formato)):"0";st.barrasDonde=v.donde||"todo";
    $("barras").value=st.barras;$("barrasDonde").value=st.barrasDonde;layoutBars();save()}}).catch(()=>{});
})();
/* ---------- arranque: carta de ejemplo + MA Vivo Día ---------- */
if(!st.eleccion.dlog)st.eleccion.dlog={lut:"ma_dlog_dia",intensidad:100};
renderPerfiles();save();
const sample=new Image();sample.onload=()=>{setSource(sample,sample.naturalWidth,sample.naturalHeight);restoreLut()};sample.src=CARTA;
</script>
