<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor de Vlogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Big+Shoulders+Display:wght@800&display=swap">
<style>
/* App de IA: riel de navegacion (Inicio, Proyectos, Looks, Perfil) + contenido con tarjetas de imagen.
   El editor de cada vlog vive adentro, con pasos arriba y Claude a la derecha. Calido y sobrio, inspirado en Claude. */
:root{
  --bg:#F5F4EE; --surface:#FFFFFF; --surface-2:#EFEDE4; --ink:#1F1E1D; --ink-2:#6B6A64; --line:#E2DFD3;
  --accent:#C96442; --accent-ink:#FFFFFF; --accent-soft:rgba(201,100,66,.12);
  --violet:#7A68D8; --violet-soft:rgba(122,104,216,.12);
  --ok:#4E8A5E; --warn:#B7791F; --err:#B4432F; --scrim:rgba(20,20,19,.45);
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-title:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1C1C; --surface:#262626; --surface-2:#141414; --ink:#F4F4F2; --ink-2:#A3A3A3; --line:#363636;
  --accent:#D97757; --accent-soft:rgba(217,119,87,.16); --violet:#A193F2; --violet-soft:rgba(161,147,242,.16);
  --ok:#6FB57F; --warn:#D9A440; --err:#E07A63; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --surface:#262626; --surface-2:#141414; --ink:#F4F4F2; --ink-2:#A3A3A3; --line:#363636;
  --accent:#D97757; --accent-soft:rgba(217,119,87,.16); --violet:#A193F2; --violet-soft:rgba(161,147,242,.16);
  --ok:#6FB57F; --warn:#D9A440; --err:#E07A63; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--line);background:var(--surface-2)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 17px var(--f-serif);margin-bottom:14px}
.rb{width:62px;display:grid;justify-items:center;gap:3px;padding:9px 0;border:0;border-radius:12px;background:transparent;color:var(--ink-2);font-size:11.5px;font-weight:500}
.rb:hover{color:var(--ink);background:var(--surface)}
.rb[aria-current=page]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rail .sp{flex:1}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:600 14px var(--f-sans);overflow:hidden;flex:none;background:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:84px;height:84px;font-size:30px}
.rail .av{cursor:pointer;border:2px solid var(--surface)}
.view{min-width:0;overflow:auto;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hello{font-size:14px;color:var(--ink-2)}
.conn{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:6px 10px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.conn.on i{background:var(--ok)}

/* ---------- tipografia y piezas ---------- */
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h1{font:500 40px/1.1 var(--f-serif);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2.sec{font:500 22px/1.2 var(--f-serif);margin:0;letter-spacing:-.01em}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{border:0;background:none;color:var(--ink-2);font-size:14px;font-weight:500;padding:0}
.link:hover{color:var(--ink)}
.lede{color:var(--ink-2);max-width:62ch;margin:8px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0}
.card h3{font:600 15px var(--f-sans);margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h3 small{font:400 12.5px var(--f-sans);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px}
.field>span{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--ink);color:var(--bg);display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--err);box-shadow:inset 0 0 0 1px var(--err)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 0}
.sw>div{display:grid}
.sw b{font-weight:500}
.sw small{color:var(--ink-2);font-size:13px}
.toggle{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.slider{display:grid;gap:6px}
.slider .top{display:flex;justify-content:space-between;font-size:13.5px}
.slider .top span{color:var(--ink-2)}
.slider .top b{font:500 13px var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:13px;color:var(--ink-2);margin:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.pill{font:500 11px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.v{background:var(--violet-soft);color:var(--violet)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.o{background:rgba(78,138,94,.14);color:var(--ok)}

/* ---------- inicio ---------- */
.hero{display:grid;gap:18px;justify-items:center;text-align:center;padding:30px 0 6px}
.hero h1{font-size:52px;max-width:16ch}
.hero h1 em{font-style:italic;color:var(--accent)}
.composer{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;text-align:left;box-shadow:0 10px 40px -20px rgba(0,0,0,.25)}
.composer input.big{border:0;background:transparent;font:500 22px var(--f-serif);padding:8px 10px}
.composer input.big:focus{outline:none}
.composer .cbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.composer .folder{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--ink-2)}
.composer .folder input{border:0;background:transparent;padding:9px 0}
.composer .lookpick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 5px;background:var(--bg);font-size:13.5px;font-weight:500}
.composer .lookpick img,.composer .lookpick span.ph{width:30px;height:30px;border-radius:7px;object-fit:cover;background:var(--surface-2)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:760px}
.steps3 div{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.steps3 b{color:var(--ink);font-size:14px}
@media (max-width:760px){.steps3{grid-template-columns:minmax(0,1fr)}}

/* tarjetas de imagen */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,250px);gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.carousel>*{scroll-snap-align:start}
.icard{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:grid;text-align:left;padding:0;color:inherit}
.icard .img{aspect-ratio:4/5;background:linear-gradient(160deg,#3b3a37,#161616);position:relative;overflow:hidden}
.icard.wide .img{aspect-ratio:16/10}
.icard .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease,opacity .25s}
.icard:hover .img img.after{transform:scale(1.03)}
.icard .img img.before{position:absolute;inset:0;opacity:0}
.icard:hover .img img.before{opacity:1}
.icard .shade{position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.icard .meta{position:absolute;left:12px;right:12px;bottom:11px;color:#fff;display:grid;gap:4px}
.icard .meta b{font:500 18px/1.15 var(--f-serif)}
.icard .meta span{font-size:12.5px;opacity:.85}
.icard .badges{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.icard .badges .pill{background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.icard .badges .pill.a{background:var(--accent);color:#fff}
.icard.add{place-items:center;border-style:dashed;background:transparent;min-height:100%}
.icard.add .plus{display:grid;gap:8px;justify-items:center;color:var(--ink-2);font-weight:500;padding:30px}
.icard.add .plus i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:400 28px/1 var(--f-sans);font-style:normal}
.icard.sel{outline:3px solid var(--accent);outline-offset:-3px}
.icard .noimg{position:absolute;inset:0;display:grid;place-items:center;color:#9a9a9a;font:12px var(--f-mono)}

/* proyectos */
.pcard .img{aspect-ratio:16/10}
.pcard .info{padding:12px 14px;display:grid;gap:6px;background:var(--surface)}
.pcard .info b{font:500 17px/1.2 var(--f-serif)}
.pcard .info .row{gap:6px}

/* perfil */
.phead{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.phead .name{font:500 34px/1.1 var(--f-serif);border:0;background:transparent;padding:0;width:auto;min-width:0}
.phead .name:focus{outline:none;border-bottom:1px solid var(--accent)}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%}
.prow[aria-current=true]{border-color:var(--ink)}
.prow span{flex:1;font-weight:500}
.defaults{display:grid;gap:10px}
.drow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:center}
.drow b{font:500 13px var(--f-mono)}
.minilooks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.ml{flex:none;width:84px;border:2px solid transparent;border-radius:10px;padding:0;background:var(--surface-2);overflow:hidden;display:grid;text-align:left}
.ml[aria-pressed=true]{border-color:var(--accent)}
.ml .im{aspect-ratio:1;background:#2a2a2a}
.ml .im img{width:100%;height:100%;object-fit:cover;display:block}
.ml span{font-size:11.5px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- editor ---------- */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100%}
.ecol{overflow:auto;min-width:0}
.ehead{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px max(28px,env(safe-area-inset-right,0px)) 0 max(28px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.etitle{display:flex;align-items:center;gap:12px;min-width:0}
.back{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.etitle b{font:500 20px/1.2 var(--f-serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.stepper::-webkit-scrollbar{display:none}
.st{flex:none;display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:9px 12px 11px;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.st .n{font:500 11px var(--f-mono)}
.st[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.pend{background:var(--accent)}
.epage{max-width:960px;margin:0 auto;padding-block:24px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:20px}
.epage h1{font-size:32px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.clip.off{opacity:.45}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#3a3a3a,#1a1a1a);position:relative;display:grid;place-items:center;color:#bbb;font:12px var(--f-mono)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ord,.thumb .dur{position:absolute;background:rgba(0,0,0,.6);color:#fff;font:500 11px var(--f-mono);padding:2px 7px;border-radius:6px}
.thumb .ord{top:8px;left:8px}.thumb .dur{bottom:8px;right:8px}
.clip .body{padding:10px 12px;display:grid;gap:8px}
.clip .name{font:500 13px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip select{padding:6px 8px;font-size:13px}
.clip .acts{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 9px;font-size:12.5px}
.mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.timeline{display:flex;gap:4px;height:40px;border-radius:10px;overflow:hidden}
.timeline div{display:grid;place-items:center;font:500 11px var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.blocks{display:grid;gap:8px}
.block{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.block .k{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.k.teaser{color:var(--accent)}.k.montaje{color:var(--violet)}.k.charla{color:var(--ink-2)}.k.cierre{color:var(--ok)}
.stage{position:relative;background:#000;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:12px;touch-action:pan-y;cursor:ew-resize;user-select:none}
.stage canvas{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;background:#000;pointer-events:none}.bar.t{top:0}.bar.b{bottom:0}
.split{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.split::after{content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.stag{position:absolute;top:10px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:6px;pointer-events:none}
.stag.l{left:10px}.stag.r{right:10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip button{flex:none;width:112px;aspect-ratio:16/9;border-radius:8px;border:2px solid transparent;padding:0;overflow:hidden;background:#222;color:#bbb;font:11px var(--f-mono)}
.strip button[aria-pressed=true]{border-color:var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.bigpct{font:500 40px/1 var(--f-serif)}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:860px){.frames{grid-template-columns:minmax(0,1fr)}}
.frame{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 30% 20%,#2c3a3a,#0d0f10 70%);display:grid;place-items:center}
.frame.talk{background:radial-gradient(120% 90% at 70% 30%,#5a4a3a,#151210 70%)}
.frame small.cap{position:absolute;top:10px;left:12px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.neon{text-align:center;padding:0 8%;font:800 clamp(22px,3.6vw,46px)/1 var(--f-title);color:#ff4a3d;letter-spacing:.02em;text-shadow:0 0 6px rgba(255,74,61,.9),0 0 24px rgba(255,74,61,.6),0 0 60px rgba(255,74,61,.35);text-transform:uppercase}
.neon small{display:block;font-size:.55em;margin-bottom:.15em}
.sub{position:absolute;bottom:8%;left:0;right:0;text-align:center;color:#fff;font:400 clamp(11px,1.6vw,15px) var(--f-sans);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.place{position:absolute;top:46%;left:6%;right:6%;display:flex;justify-content:space-between;color:#fff;font:400 clamp(11px,1.5vw,14px) var(--f-sans)}
.vers{display:grid;gap:10px}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
video{width:100%;border-radius:10px;background:#000;max-width:100%}
.notes{display:grid;gap:8px}
.notei{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.notei input{padding:8px 10px}

/* claude */
.claude{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:100%;min-width:0}
.ch{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ch h3{margin:0;font:500 20px var(--f-serif);display:flex;align-items:center;gap:10px}
.spark{width:24px;height:24px;border-radius:8px;background:var(--violet);display:grid;place-items:center;color:#fff;font:700 13px var(--f-sans)}

/* =========================================================
   Color: LUT .cube -> WebGL (visor interactivo y miniaturas)
   ========================================================= */
const FOTO_BASE={dlog:"app/foto_base_dlog.jpg",dlog2:"app/foto_base_dlog2.jpg",rec709:"app/foto_base_rec709.jpg"};
const baseFor=cam=>Store.img(PERFIL?.fotos_base?.[cam])||FOTO_BASE[cam]||FOTO_BASE.dlog;
function parseCube(t){let n=0;const v=[];for(const line of t.split(/\r?\n/)){const s=line.trim();if(!s||s[0]=="#")continue;if(/^LUT_3D_SIZE/i.test(s)){n=parseInt(s.split(/\s+/)[1]);continue}if(/^[A-Z_]/i.test(s))continue;const p=s.split(/\s+/);if(p.length>=3)v.push(+p[0],+p[1],+p[2],1)}if(!n||v.length!==n*n*n*4)throw Error("El archivo no es una LUT 3D válida");return{n,data:new Float32Array(v)}}
const lutCache={};
async function lutOf(look){const k=look.archivo;if(!k)return null;return lutCache[k]||(lutCache[k]=Store.cube(look).then(parseCube).catch(e=>{delete lutCache[k];throw e}))}
const FS=`#version 300 es
precision highp float;precision highp sampler3D;in vec2 uv;out vec4 o;uniform sampler2D img;uniform sampler3D lut;uniform float n,amt,split,has;
void main(){vec3 c=texture(img,uv).rgb;vec3 g=c;if(has>.5){vec3 q=clamp(c,0.,1.)*(n-1.)/n+.5/n;g=mix(c,texture(lut,q).rgb,amt);}o=vec4(uv.x<split?c:g,1);}`;
function makeGL(cv){const gl=cv.getContext("webgl2",{preserveDrawingBuffer:true});if(!gl)return null;
  const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;uv.y=1.-uv.y;gl_Position=vec4(p,0,1);}`));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=k=>gl.getUniformLocation(pr,k);
  const ti=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ti);[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
  const tl=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,tl);[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T,gl.TEXTURE_WRAP_R].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.CLAMP_TO_EDGE));
  gl.uniform1i(U("img"),0);gl.uniform1i(U("lut"),1);
  let n=0;
  return{
    setImage(im){const w=im.videoWidth||im.naturalWidth||im.width,h=im.videoHeight||im.naturalHeight||im.height;if(cv.width!==w)cv.width=w;if(cv.height!==h)cv.height=h;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ti);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im)},
    setLut(l){if(!l){n=0;return}gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,tl);gl.texImage3D(gl.TEXTURE_3D,0,gl.RGBA16F,l.n,l.n,l.n,0,gl.RGBA,gl.FLOAT,l.data);n=l.n},
    draw(amt,split){gl.viewport(0,0,cv.width,cv.height);gl.uniform1f(U("n"),n||1);gl.uniform1f(U("amt"),amt);gl.uniform1f(U("split"),split);gl.uniform1f(U("has"),n?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}}}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>res(im);im.onerror=()=>rej(Error("No pude abrir la imagen"));im.src=src})}
// miniatura graduada (para fotos LOG o para looks sin foto)
let thumbGL=null;const thumbCache={};
async function gradedThumb(src,look,amt,maxW=720){const key=src+"|"+look.archivo+"|"+amt;if(thumbCache[key])return thumbCache[key];
  return thumbCache[key]=(async()=>{const [im,l]=await Promise.all([loadImg(src),lutOf(look)]);
    const c=document.createElement("canvas");const s=Math.min(1,maxW/(im.naturalWidth||1));const w=Math.round(im.naturalWidth*s),h=Math.round(im.naturalHeight*s);
    const tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;tmp.getContext("2d").drawImage(im,0,0,w,h);
    thumbGL??=(()=>{const cv=document.createElement("canvas");return{cv,g:makeGL(cv)}})();if(!thumbGL.g)return src;
    thumbGL.g.setImage(tmp);thumbGL.g.setLut(l);thumbGL.g.draw(amt/100,0);c.width=w;c.height=h;c.getContext("2d").drawImage(thumbGL.cv,0,0);return c.toDataURL("image/jpeg",.86)})().catch(()=>null)}

/* sin servidor (link de claude.ai o navegador): el navegador abre el Finder y lee la carpeta.
   No da la ruta completa, pero alcanza para ver los clips; para editar con Claude se usa la app de la Mac. */
let LOCAL_PICK=null;
const VID_RE=/\.(mp4|mov|m4v|mts|mxf)$/i;
function elegirCarpetaLocal(){return new Promise(res=>{const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||!("webkitdirectory" in document.createElement("input"));
  const f=$(ios?"fileVids":"fileDir");f.value="";f.onchange=async()=>{const ok=x=>{const parts=(x.webkitRelativePath||x.name).split("/").slice(1);return parts.length<=1||(parts.length===2&&/^b-?roll$/i.test(parts[0]))};
    const fs=[...f.files].filter(x=>VID_RE.test(x.name)&&!x.name.startsWith(".")&&ok(x));
    if(!fs.length){toast("No encontré videos en esa carpeta");return res(null)}
    const nombre=ios?"Clips elegidos":(fs[0].webkitRelativePath||"").split("/")[0]||"Carpeta";
    toast("Leyendo "+fs.length+" clips…");const clips=await leerClipsLocales(fs);res({nombre,clips})};f.click()})}
async function leerClipsLocales(files){const rel=f=>(f.webkitRelativePath||f.name).split("/").slice(1).join("/")||f.name;
  const orden=[...files].sort((a,b)=>{const ra=rel(a),rb=rel(b),ba=/(^|\/)b-?roll\//i.test(ra),bb=/(^|\/)b-?roll\//i.test(rb);return ba!==bb?(ba?1:-1):ra.localeCompare(rb,undefined,{numeric:true})});
  const out=[];for(const [i,f] of orden.entries()){const r=rel(f);const meta=await metaVideo(f);
    out.push({archivo:r,orden:i+1,duracion:meta.dur,ancho:meta.w,alto:meta.h,audio:true,perfil:/^DJI/i.test(f.name)?"dlog":"desconocido",broll:/(^|\/)b-?roll\//i.test(r),descartado:false,thumb_data:meta.thumb,local:true,peso_mb:Math.round(f.size/1e6)})}
  return out}
function metaVideo(file){return new Promise(res=>{const v=document.createElement("video");const url=URL.createObjectURL(file);v.muted=true;v.preload="metadata";v.playsInline=true;
  let done=false;const fin=(o)=>{if(done)return;done=true;URL.revokeObjectURL(url);res(o)};
  v.onloadedmetadata=()=>{v.currentTime=Math.min(1,(v.duration||2)/2)};
  v.onseeked=()=>{let thumb=null;try{const c=document.createElement("canvas");const s=320/(v.videoWidth||320);c.width=320;c.height=Math.round((v.videoHeight||180)*s);c.getContext("2d").drawImage(v,0,0,c.width,c.height);thumb=c.toDataURL("image/jpeg",.7)}catch(e){}
    fin({dur:v.duration||0,w:v.videoWidth||null,h:v.videoHeight||null,thumb})};
  v.onerror=()=>fin({dur:0,w:null,h:null,thumb:null});setTimeout(()=>fin({dur:v.duration||0,w:v.videoWidth||null,h:v.videoHeight||null,thumb:null}),8000);v.src=url})}
function elegirAudioLocal(){return new Promise(res=>{const f=$("fileAud");f.value="";f.onchange=()=>res(f.files[0]?.name||null);f.click()})}
async function elegirRuta(modo="carpeta",titulo){if(!SERVER){if(modo==="archivo")return elegirAudioLocal();LOCAL_PICK=await elegirCarpetaLocal();return LOCAL_PICK?LOCAL_PICK.nombre:null}
  try{const d=await post("/api/elegir",{modo,titulo});if(d.nativo)return d.ruta}catch(e){}

function explorador(modo,titulo){return new Promise(res=>{const m=document.createElement("div");m.className="modal";let sel=null,dir="";
  m.innerHTML=`<div class="sheet small" role="dialog" aria-modal="true"><div class="form"><h2>${esc(titulo||(modo==="archivo"?"Elegí el archivo":"Elegí la carpeta"))}<button class="x" type="button" id="eX" aria-label="Cerrar">${icon.x}</button></h2><div class="exp" id="exp"></div>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" type="button" id="eCancel">Cancelar</button><button class="btn accent" type="button" id="eOk">${modo==="archivo"?"Usar este archivo":"Usar esta carpeta"}</button></div></div></div>`;
  document.body.appendChild(m);const close=v=>{m.remove();res(v)};$("eX").onclick=$("eCancel").onclick=()=>close(null);m.onclick=e=>{if(e.target===m)close(null)};
  $("eOk").onclick=()=>{if(modo==="archivo"&&!sel)return toast("Elegí un archivo de la lista");close(modo==="archivo"?sel:dir)};
  async function ir(d){const r=await (await fetch("/api/explorar?modo="+modo+"&dir="+encodeURIComponent(d||""))).json();dir=r.dir;sel=null;const J=n=>(r.dir==="/"?"":r.dir)+"/"+n;
    $("exp").innerHTML=`<div class="roots">${r.raices.map(x=>`<button type="button" class="chip" data-d="${esc(x)}">${esc(x.split("/").pop()||x)}</button>`).join("")}</div>

     <div class="list">${r.padre?`<button type="button" data-d="${esc(r.padre)}">${icon.back} Subir</button>`:""}${r.carpetas.map(c=>`<button type="button" data-d="${esc(J(c))}">${icon.folder} ${esc(c)}</button>`).join("")}
      ${r.archivos.map(f=>`<button type="button" data-f="${esc(J(f))}">♪ ${esc(f)}</button>`).join("")}${!r.carpetas.length&&!r.archivos.length?`<div class="none">Carpeta vacía</div>`:""}</div>`;
    $("exp").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>ir(b.dataset.d));

async function crearVlog(titulo,carpeta){if(!titulo)return $("cTitulo").focus(),toast("Escribí el título del vlog");
  if(!carpeta&&SERVER)return $("cCarpeta").focus(),toast("Escribí la ruta de la carpeta del día");
  V=DEFAULT_VLOG();V.titulo=titulo;V.carpeta=carpeta||("vista-previa/"+uid());
  if(!SERVER&&LOCAL_PICK&&carpeta===LOCAL_PICK.nombre){V.carpeta="vista-previa/"+LOCAL_PICK.nombre+"-"+uid();V.carpeta_nombre=LOCAL_PICK.nombre;V.material.clips=LOCAL_PICK.clips;LOCAL_PICK=null}
  if(SERVER){try{const d=await (await fetch("/api/vlog?carpeta="+encodeURIComponent(V.carpeta))).json();if(d.vlog){V=merge(DEFAULT_VLOG(),d.vlog);V.titulo=V.titulo||titulo;toast("Ese vlog ya existía: lo abrí")}}catch(e){}}
  V.perfil=PERFIL.id;await saveNow();if(!(PERFIL.proyectos||[]).includes(V.carpeta)){PERFIL.proyectos=[V.carpeta,...(PERFIL.proyectos||[])]}
  ls.set("ultimo",V.carpeta);TAB="material";go("editor")}
async function abrirProyecto(carpeta){if(SERVER){const d=await (await fetch("/api/vlog?carpeta="+encodeURIComponent(carpeta))).json();if(!d.vlog)return toast("No encuentro esa carpeta. ¿Está conectado el disco?");V=merge(DEFAULT_VLOG(),d.vlog)}
  else{const b=(ls.get("borradores")||{})[carpeta];if(!b)return;V=merge(DEFAULT_VLOG(),b)}
  ls.set("ultimo",carpeta);TAB=ls.get("tab")||"material";go("editor")}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,500)}
async function saveNow(){clearTimeout(saveT);if(!V)return;
  if(!SERVER){const all=ls.get("borradores")||{};all[V.carpeta]=V;ls.set("borradores",all);return}
  try{await post("/api/vlog",{carpeta:V.carpeta,vlog:V})}catch(e){toast(e.message)}}
function get(path){return path.split(".").reduce((o,k)=>o?.[k],V)}
function set(path,val){const ks=path.split(".");let o=V;ks.slice(0,-1).forEach(k=>{o[k]??={};o=o[k]});o[ks.at(-1)]=val;save();renderSteps()}
const FMT={};
function seg(path,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${path}" data-v='${JSON.stringify(v)}' aria-pressed="${JSON.stringify(get(path))===JSON.stringify(v)}">${l}</button>`).join("")}</div>`}
function sw(path,title,sub){return `<label class="sw"><div><b>${title}</b>${sub?`<small>${sub}</small>`:""}</div><input type="checkbox" class="toggle" data-sw="${path}" ${get(path)?"checked":""}></label>`}
function sl(path,title,min,max,step,fmt){FMT[path]=fmt;const v=get(path);return `<div class="slider"><div class="top"><span>${title}</span><b data-out="${path}">${fmt(v)}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-sl="${path}" aria-label="${title}"></div>`}
function fld(path,label,ph){return `<label class="field"><span>${label}</span><input type="text" data-txt="${path}" value="${esc(get(path))}" placeholder="${esc(ph)}"></label>`}
let onChange=()=>{};
function wire(root){
  root.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{set(b.dataset.seg,JSON.parse(b.dataset.v));b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));onChange(b.dataset.seg)});
  root.querySelectorAll("[data-sw]").forEach(i=>i.onchange=()=>{set(i.dataset.sw,i.checked);onChange(i.dataset.sw)});
  root.querySelectorAll("[data-sl]").forEach(i=>{const f=FMT[i.dataset.sl];i.oninput=()=>{const v=+i.value;root.querySelector(`[data-out="${i.dataset.sl}"]`).textContent=f(v);set(i.dataset.sl,v);onChange(i.dataset.sl)}});
  root.querySelectorAll("[data-txt]").forEach(i=>i.oninput=()=>{set(i.dataset.txt,i.value);onChange(i.dataset.txt)})}
const abs=rel=>rel&&rel.startsWith("/")?rel:(V.carpeta?V.carpeta.replace(/\/$/,"")+"/"+rel:rel);

 ["material","Material",()=>V.material.clips.length>0],["historia","Historia",()=>V.historia.bloques?.length>0],["cortes","Cortes",()=>true],

 <aside class="claude" id="claude"><div class="ch"><h3><span class="spark" aria-hidden="true">C</span>Claude<button class="btn ghost mclose" type="button" id="mclose">Cerrar</button></h3><span class="note" id="cstatus"></span></div>
  <div class="feed" id="feed" aria-live="polite"></div>

 <div class="mbar"><button class="btn ghost" type="button" id="mprev">‹</button><button class="btn" type="button" id="mnext"><span>Siguiente</span></button><button class="btn mc" type="button" id="mclaude">Claude</button></div>`}
function renderSteps(){const s=$("stepper");if(!s)return;s.innerHTML=STEPS.map(([k,l,ok],i)=>`<button class="st" type="button" data-step="${k}" ${TAB===k?'aria-current="page"':""}><span class="n">${i+1}</span>${l}<i class="dot ${ok()?"ok":"pend"}"></i></button>`).join("");
  s.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>step(b.dataset.step));s.querySelector('[aria-current="page"]')?.scrollIntoView({block:"nearest",inline:"center"});
  const i=STEPS.findIndex(t=>t[0]===TAB);if($("mprev")){$("mprev").disabled=i<=0;$("mnext").firstElementChild.textContent=i<STEPS.length-1?"Siguiente: "+STEPS[i+1][1]:"Listo · abrir Claude"}}
function step(k){TAB=k;ls.set("tab",k);renderSteps();renderStep();$("ecol").scrollTop=0;window.scrollTo(0,0)}
function head(i,title,lede){return `<div><div class="eyebrow">Paso ${STEPS.findIndex(t=>t[0]===TAB)+1} de ${STEPS.length}</div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div>`}
function renderStep(){onChange=()=>{};stopViewer();const P=$("epage");P.classList.remove("tlpage");document.querySelector(".editor")?.classList.toggle("wide",TAB==="timeline");P.innerHTML=STEP_VIEWS[TAB]();wire(P);STEP_AFTER[TAB]?.(P)}
function wireEditor(v){renderSteps();renderStep();$("back").onclick=()=>{saveNow();if(TL.playing)stopPlay();go("proyectos")};
  const sheet=o=>$("claude").classList.toggle("open",o);$("mclaude").onclick=()=>sheet(true);$("openC").onclick=()=>sheet(true);$("mclose").onclick=()=>sheet(false);
  $("mprev").onclick=()=>{const i=STEPS.findIndex(t=>t[0]===TAB);if(i>0)step(STEPS[i-1][0])};
  $("mnext").onclick=()=>{const i=STEPS.findIndex(t=>t[0]===TAB);if(i<STEPS.length-1)step(STEPS[i+1][0]);else sheet(true)};
  claudeInit()}

function colorStep(P){const g=makeGL($("cv"));if(!g){$("stage").innerHTML='<div class="empty" style="color:#bbb">Este navegador no soporta WebGL2</div>';return}
  const me={};VIEWER=me;let split=.5;const cv=$("cv");
  const entry=()=>V.color.looks[CAM]??={look_id:"",lut:"",intensidad:100};
  const draw=()=>{if(VIEWER!==me)return;g.draw((entry().intensidad??100)/100,split);$("split").style.left=`calc(${split*100}% - 1px)`};
  const bars=()=>{const f=V.color.barras.formato;const r=f?parseFloat(f):0;const ar=cv.width/cv.height;const h=r>ar?(1-ar/r)/2*100:0;$("barT").style.height=$("barB").style.height=h+"%"};
  async function useLut(){g.setLut(null);draw();const e=entry();const look=PERFIL.looks.find(l=>l.id===e.look_id)||(e.lut?{archivo:e.lut}:null);if(!look)return;
    try{const l=await lutOf(look);if(VIEWER===me){g.setLut(l);draw()}}catch(err){toast(err.message)}}
  async function src(u){try{const im=await loadImg(u);if(VIEWER!==me)return;g.setImage(im);bars();draw()}catch(e){}}
  function strip(){const cs=V.material.clips.filter(c=>c.perfil===CAM&&c.thumb&&!c.descartado);
    const items=cs.length&&SERVER?cs.map(c=>[Store.media(abs(c.thumb)),c.archivo]):[[baseFor(CAM),"Foto de prueba"],[CARTA,"Carta de color"]];
    $("strip").innerHTML=items.map(([u,n],i)=>`<button type="button" data-src="${esc(u)}" aria-pressed="${i===0}" title="${esc(n)}">${u===CARTA?"Carta":`<img src="${esc(u)}" alt="">`}</button>`).join("");
    $("strip").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("strip").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));src(b.dataset.src)});src(items[0][0])}
  function panel(){$("camSeg").innerHTML=`<div class="seg">${CAMS.map(([k,l])=>`<button type="button" data-cam="${k}" aria-pressed="${CAM===k}">${l}</button>`).join("")}</div>`;
    $("camSeg").querySelectorAll("[data-cam]").forEach(b=>b.onclick=()=>{CAM=b.dataset.cam;ls.set("cam",CAM);panel();strip();useLut()});
    const e=entry();const list=PERFIL.looks.filter(l=>l.perfil_camara===CAM);
    $("lookPick").innerHTML=list.map(l=>lookCard(l,{sel:e.look_id===l.id})).join("")+`<button type="button" class="icard add" data-newlook><div class="plus"><i>+</i>Nuevo look</div></button>`;
    $("lookPick").querySelectorAll("[data-look]").forEach(b=>b.onclick=()=>{const l=PERFIL.looks.find(x=>x.id===b.dataset.look);const sel=e.look_id===l.id;
      V.color.looks[CAM]=sel?{look_id:"",lut:"",intensidad:100}:{look_id:l.id,lut:l.archivo,intensidad:l.intensidad??100};save();renderSteps();panel();useLut()});
    $("lookPick").querySelector("[data-newlook]").onclick=()=>lookModal(null);fillCovers($("lookPick"));
    $("amt").value=entry().intensidad??100;$("pct").textContent=$("amt").value+"%"}
  $("amt").oninput=e=>{entry().intensidad=+e.target.value;$("pct").textContent=e.target.value+"%";save();draw()};
  onChange=k=>{if(k.startsWith("color.barras"))bars()};
  const st=$("stage");const mv=e=>{const r=st.getBoundingClientRect();split=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));draw()};st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);mv(e)};st.onpointermove=e=>{if(e.buttons)mv(e)};
  panel();strip();useLut()}

let JOB=null, ES=null;
const QUICK=[["Editá todo","Editá el vlog completo y exportá una preview."],["Armá la historia","Transcribí y armá la historia (sin exportar todavía)."],["Exportá la final","Exportá la versión final en la resolución elegida."],["Aplicá las notas","Aplicá las notas de revisión pendientes y exportá una versión nueva."]];
const FEED=[];
function claudeInit(){$("quick").innerHTML=QUICK.map(([l,p])=>`<button type="button" data-q="${esc(p)}">${l}</button>`).join("");
  $("quick").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("pedido").value=b.dataset.q;$("pedido").focus()});
  $("cstatus").textContent=!SERVER?"Vista previa: Claude Code trabaja cuando abrís la app en tu Mac.":!CLAUDE?"No encontré Claude Code en esta Mac (ver LEEME).":"Conectado · "+CLAUDE;
  $("goC").onclick=runClaude;$("stopC").onclick=()=>{if(JOB)post("/api/claude/parar",{job:JOB}).catch(()=>{})};
  $("pedido").onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))runClaude()};
  if(!FEED.length)FEED.push({tipo:"texto",texto:"Configurá el vlog paso a paso y tocá Editar con Claude cuando quieras. Acá te muestro lo que voy haciendo."});
  FEED.forEach(paint);if(JOB)busy(true)}
function paint(ev){const f=$("feed");if(!f)return;const el=document.createElement("div");el.className="ev "+ev.tipo;
  const label=ev.tipo==="herramienta"?`${ev.nombre}: ${ev.texto}`:ev.tipo==="fin"?(ev.ok?"Listo. ":"Terminó con problemas. ")+(ev.texto||""):ev.texto;
  el.innerHTML=`<i></i><span>${esc(label)}</span>`;f.appendChild(el);f.scrollTop=f.scrollHeight}
function feed(ev){FEED.push(ev);paint(ev)}
function busy(on){const c=$("claude");if(!c)return;c.classList.toggle("running",on);$("goC").textContent=on?"Claude está trabajando…":"Editar con Claude";$("goC").disabled=on;$("stopC").hidden=!on}
async function runClaude(){if(!SERVER)return macModal("Editar con Claude necesita la app de tu Mac.");if(!CLAUDE)return toast("Instalá Claude Code y logueate (ver LEEME)");
  await saveNow();const pedido=$("pedido").value.trim()||"Editá el vlog completo y exportá una preview.";feed({tipo:"texto",texto:"Vos: "+pedido});$("pedido").value="";
  let d;try{d=await post("/api/claude/editar",{carpeta:V.carpeta,pedido})}catch(e){return feed({tipo:"error",texto:e.message})}
  JOB=d.job;busy(true);$("claude").classList.add("open");
  ES=new EventSource("/api/claude/eventos?job="+JOB);ES.onmessage=e=>{const ev=JSON.parse(e.data);feed(ev);if(ev.tipo==="fin"||ev.tipo==="fin_paso")refresh()};ES.addEventListener("fin",done);ES.onerror=done}
function done(){ES&&ES.close();ES=null;JOB=null;busy(false);refresh()}
async function refresh(){if(!SERVER||!V)return;try{const d=await (await fetch("/api/vlog?carpeta="+encodeURIComponent(V.carpeta))).json();if(d.vlog){V=merge(DEFAULT_VLOG(),d.vlog);if(VIEW==="editor"){renderSteps();if(TAB!=="color")renderStep()}}}catch(e){}}

const TRK=[{k:"textos",n:"T1",l:"Textos"},{k:"capas_color",n:"C1",l:"Color"},{k:"segmentos",n:"V1",l:"Video"},{k:"voz",n:"A1",l:"Voz"},{k:"musica",n:"A2",l:"Música"},{k:"sfx",n:"A3",l:"Efectos"}];
const fpsOf=()=>{const f=String(PLAN?.fps||"30");if(f.includes("/")){const[a,b]=f.split("/");return +a/+b}return +f||30};
const tcf=t=>{t=Math.max(0,t||0);const f=Math.floor((t%1)*fpsOf()+1e-6);return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(Math.floor(t%60)).padStart(2,"0")}:${String(f).padStart(2,"0")}`};
const fname=p=>String(p||"").split("/").pop();
const db2g=d=>Math.pow(10,d/20);
const nid=()=>"i"+Math.random().toString(36).slice(2,8);
const clipDur=c=>V.material.clips.find(x=>x.archivo===c)?.duracion||1e9;
const items=k=>k==="voz"?PLAN.segmentos:(PLAN[k]??=[]);
const r4=x=>Math.round(x*10000)/10000;

function demoPlan(){const cs=V.material.clips.filter(c=>!c.descartado).map(c=>c.archivo);const C=i=>cs.length?cs[i%cs.length]:["DJI_0001.MP4","DJI_0002.MP4","DJI_0003.MP4","broll/calle.mp4"][i%4];
  const seq=[["teaser",0,2,3.8],["teaser",3,5,6.8],["teaser",1,12,13.6],["teaser",2,8,10],["charla",0,0,34],["montaje",3,1,3],["montaje",2,20,22.2],["montaje",3,6,8],["montaje",1,40,42],["charla",1,3,31],["montaje",2,30,32.5],["montaje",3,10,12.5],["cierre",0,40,52]];
  const segmentos=seq.map(([tipo,ci,a,b],n)=>({id:nid(),n:n+1,bloque:n,tipo,clip:C(ci),entrada:a,salida:b,zoom:1,perfil:"dlog",audio:tipo==="charla"||tipo==="cierre"?"voz":"ambiente"}));
  const p={version:1,fps:"30000/1001",segmentos,capas_color:[],sfx:[{id:nid(),archivo:"whoosh.wav",t:7.6,dur:1.2,desde:0,nivel_db:-14,fade_in:0,fade_out:0}],
    musica:[{id:nid(),tema:"instrumental_teaser.mp3",t:0,dur:9.4,desde:0,nivel_db:-10,fade_in:0,fade_out:3.5},{id:nid(),tema:"instrumental_montaje.mp3",t:42.4,dur:10.5,desde:12,nivel_db:-10,fade_in:.5,fade_out:4}],
    textos:[{id:nid(),tipo:"titulo",t:.4,dur:3.6,numero:V.textos?.titulo_episodio?.numero||"1",texto:V.textos?.titulo_episodio?.texto||V.titulo||"TÍTULO"},{id:nid(),tipo:"lugar_hora",t:9.7,dur:3.5,lugar:"Madrid",hora:"11:00 AM"}],_demo:true};
  return p}
function normalize(){for(const k of ["segmentos","capas_color","musica","sfx","textos"]){PLAN[k]??=[];PLAN[k].forEach(x=>x.id??=nid())}ripple()}
function ripple(){let t=0;const f=fpsOf();for(const s of PLAN.segmentos){s.dur=r4(s.salida-s.entrada);s.frames=Math.max(1,Math.round(s.dur*f));s.t=r4(t);t+=s.dur}PLAN.duracion=r4(t)}
function push(){TL.hist.push(JSON.stringify(PLAN));if(TL.hist.length>80)TL.hist.shift();TL.fut=[];toolsState()}
function undo(){if(!TL.hist.length)return;TL.fut.push(JSON.stringify(PLAN));PLAN=JSON.parse(TL.hist.pop());TL.sel=null;commit(true)}
function redo(){if(!TL.fut.length)return;TL.hist.push(JSON.stringify(PLAN));PLAN=JSON.parse(TL.fut.pop());TL.sel=null;commit(true)}
let tlSaveT;
function saveTL(){clearTimeout(tlSaveT);tlSaveT=setTimeout(async()=>{const st=$("tlStatus");
  if(!SERVER||PLAN._demo){const all=ls.get("planes_demo")||{};all[V.carpeta]=PLAN;ls.set("planes_demo",all);if(st&&!TL.job)st.textContent="Guardado en este navegador (vista previa)";return}
  try{await post("/api/plan",{carpeta:V.carpeta,plan:PLAN});if(st&&!TL.job)st.textContent="Guardado · "+new Date().toLocaleTimeString().slice(0,5)}catch(e){toast(e.message)}},700)}
function commit(noSave){ripple();drawTracks();inspector();toolsState();monShow(TL.time);if(!noSave)saveTL();else saveTL()}

function drawHeads(){$("tlHeads").innerHTML=`<div class="th ruler"></div>`+TRK.map(t=>{const muteable=["voz","musica","sfx"].includes(t.k),hide=t.k==="textos";
  const on=muteable?items(t.k).length&&items(t.k).every(x=>x.mute):hide?items(t.k).length&&items(t.k).every(x=>x.oculto):false;
  return `<div class="th r-${t.k}"><b>${t.n}</b><span>${t.l}</span>${muteable||hide?`<button type="button" data-hk="${t.k}" aria-pressed="${!!on}" title="${hide?"Ocultar":"Silenciar"} pista">${hide?"O":"M"}</button>`:""}</div>`}).join("");
  $("tlHeads").querySelectorAll("[data-hk]").forEach(b=>b.onclick=()=>{const k=b.dataset.hk,f=k==="textos"?"oculto":"mute";const arr=items(k);const v=!arr.every(x=>x[f]);push();arr.forEach(x=>x[f]=v);drawHeads();commit()})}
function fit(){const w=$("tls").clientWidth-20;TL.pps=Math.max(4,Math.min(160,w/Math.max(10,PLAN.duracion||10)));$("tZoom").value=TL.pps}

function drawTracks(){const c=$("tlc");if(!c)return;const W=Math.max($("tls").clientWidth,(PLAN.duracion+8)*TL.pps);c.style.width=W+"px";
  const step=[.5,1,2,5,10,15,30,60,120,300].find(s=>s*TL.pps>=70)||600;let ticks="";for(let t=0;t*TL.pps<W;t+=step)ticks+=`<div class="tick" style="left:${t*TL.pps}px">${mmss(t)}</div>`;
  const looks=Object.fromEntries((PERFIL?.looks||[]).map(l=>[l.archivo,l.nombre]));
  const row=k=>items(k).map((x,i)=>{const sel=TL.sel&&TL.sel.k===(k==="voz"?"segmentos":k)&&TL.sel.i===i;const L=x.t*TL.pps,Wd=Math.max(3,x.dur*TL.pps);
    let cls=`it k-${k}${sel?" sel":""}${x.mute||x.oculto?" mute":""}`,inner="";
    if(k==="segmentos"){cls+=" t-"+x.tipo;const th=V.material.clips.find(c=>c.archivo===x.clip)?.thumb;inner=`${th&&SERVER?`<div class="thumbs" style="background-image:url('${Store.media(abs(th))}')"></div>`:""}<span>${esc(fname(x.clip))}</span>`}
    else if(k==="voz")inner=`<canvas class="wf" data-wf="voz" data-i="${i}"></canvas><span>${x.vol_db?((x.vol_db>0?"+":"")+x.vol_db+" dB"):""}</span>`;
    else if(k==="musica"||k==="sfx")inner=`<canvas class="wf" data-wf="${k}" data-i="${i}"></canvas><i class="fi" style="width:${(x.fade_in||0)*TL.pps}px"></i><i class="fo" style="width:${(x.fade_out||0)*TL.pps}px"></i><span>${esc(fname(x.tema||x.archivo))} · ${x.nivel_db??(k==="sfx"?-14:-10)} dB</span>`;
    else if(k==="textos")inner=`<span>${esc(x.tipo==="titulo"?"#"+(x.numero||"")+" "+(x.texto||""):x.tipo==="lugar_hora"?(x.lugar||"")+" · "+(x.hora||""):x.texto||"")}</span>`;
    else if(k==="capas_color")inner=`<span>${esc(x.nombre||looks[x.lut]||fname(x.lut))} · ${x.intensidad??100}%</span>`;
    return `<div class="${cls}" data-k="${k}" data-i="${i}" style="left:${L}px;width:${Wd}px">${inner}</div>`}).join("");
  c.innerHTML=`<div class="tr ruler" id="ruler">${ticks}</div>`+TRK.map(t=>`<div class="tr r-${t.k}" data-row="${t.k}">${row(t.k)}</div>`).join("")+`<div class="playhead" id="ph"></div>`;
  $("tl").classList.toggle("cut",TL.tool==="cut");movePH();if(!TL.dragging)drawWaves()}
function movePH(){const p=$("ph");if(p)p.style.left=(TL.time*TL.pps)+"px";const d=$("tcd");if(d)d.textContent=`${tcf(TL.time)} / ${tcf(PLAN?.duracion)}`}

/* formas de onda */
const WAVES={};
async function wave(path){if(!SERVER||!path)return null;return WAVES[path]??=fetch("/api/ondas?p="+encodeURIComponent(path)).then(r=>r.ok?r.json():null).catch(()=>null)}
function fakeWave(seed,n){let s=seed;const a=[];for(let i=0;i<n;i++){s=(s*9301+49297)%233280;a.push(.25+.6*Math.abs(Math.sin(i/7+seed))*(.5+.5*(s/233280)))}return a}
async function drawWaves(){for(const cv of document.querySelectorAll("canvas.wf")){const k=cv.dataset.wf,x=(k==="voz"?PLAN.segmentos:PLAN[k])[+cv.dataset.i];if(!x)continue;
  const path=k==="voz"?abs(x.clip):k==="musica"?x.tema:x.archivo;const w=await wave(path);if(!cv.isConnected)continue;
  const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)continue;cv.width=W;cv.height=H;const g=cv.getContext("2d");g.fillStyle="rgba(255,255,255,.9)";
  const from=k==="voz"?x.entrada:(x.desde||0);
  for(let px=0;px<W;px++){const t=from+px/TL.pps;let v;if(w){const i=Math.floor(t*w.por_seg);v=w.picos[w.picos.length?i%w.picos.length:0]||0}else v=fakeWave((path||"").length,Math.ceil(W))[px];const h=Math.max(1,v*H*.9);g.fillRect(px,(H-h)/2,1,h)}}}

/* ---------- interacción ---------- */
function snapT(t,ignore){if(!TL.snap)return t;const tol=8/TL.pps;const c=[0,TL.time];PLAN.segmentos.forEach(s=>c.push(s.t,s.t+s.dur));
  for(const k of ["textos","capas_color","musica","sfx"])items(k).forEach(x=>{if(x!==ignore)c.push(x.t,x.t+x.dur)});let best=t,bd=tol;for(const v of c){const d=Math.abs(v-t);if(d<bd){bd=d;best=v}}return best}
function select(k,i){TL.sel=i==null?null:{k:k==="voz"?"segmentos":k,i};drawTracks();inspector()}
function wireTools(){const T=$("tlTools");
  T.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{TL.tool=b.dataset.tool;toolsState();drawTracks()});
  $("tUndo").onclick=undo;$("tRedo").onclick=redo;$("tSnap").onclick=()=>{TL.snap=!TL.snap;toolsState()};
  $("tZoom").oninput=e=>{const mid=($("tls").scrollLeft+$("tls").clientWidth/2)/TL.pps;TL.pps=+e.target.value;drawTracks();$("tls").scrollLeft=mid*TL.pps-$("tls").clientWidth/2};
  $("tFit").onclick=()=>{fit();drawTracks()};
  $("aTexto").onclick=()=>{push();PLAN.textos.push({id:nid(),tipo:"texto",texto:"Texto nuevo",estilo:"simple",pos:"abajo",t:r4(TL.time),dur:3});commit();select("textos",PLAN.textos.length-1)};
  $("aColor").onclick=()=>{const l=(PERFIL?.looks||[])[0];if(!l)return toast("Primero cargá un look en tu perfil");push();PLAN.capas_color.push({id:nid(),nombre:l.nombre,t:r4(TL.time),dur:6,lut:l.archivo,intensidad:l.intensidad??100});commit();select("capas_color",PLAN.capas_color.length-1)};
  $("aMusica").onclick=()=>audioModal("musica");$("aSfx").onclick=()=>audioModal("sfx");
  $("tExpP").onclick=()=>exportar(true);$("tPr").onclick=e=>abrirPremiere(e.currentTarget);$("tExpF").onclick=()=>exportar(false);
  $("tPlay").onclick=togglePlay;$("tStart").onclick=()=>seek(0);
  $("tPrevE").onclick=()=>{const b=PLAN.segmentos.map(s=>s.t).filter(t=>t<TL.time-.01);seek(b.length?b.at(-1):0)};
  $("tNextE").onclick=()=>{const b=PLAN.segmentos.map(s=>s.t+s.dur).find(t=>t>TL.time+.01);seek(b??PLAN.duracion)};
  const sc=$("tls");
  sc.onpointerdown=e=>{const it=e.target.closest(".it");if(it)return itemDown(e,it);
    const r=$("tlc").getBoundingClientRect();if(e.target.closest("#ruler")||e.target.closest(".tr")){const go_=ev=>seek(Math.max(0,Math.min(PLAN.duracion,(ev.clientX-r.left)/TL.pps)));go_(e);
      if(e.target.closest("#ruler")){const mv=ev=>go_(ev),up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up)};addEventListener("pointermove",mv);addEventListener("pointerup",up)}else select(null)}};
  document.onkeydown=e=>{if(TAB!=="timeline"||VIEW!=="editor"||e.target.closest("input,textarea,select"))return;const m=e.metaKey||e.ctrlKey;
    if(e.key===" "){e.preventDefault();togglePlay()}else if(m&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
    else if(e.key==="Delete"||e.key==="Backspace"){if(TL.sel){e.preventDefault();removeSel()}}
    else if(e.key==="c"||e.key==="C"){TL.tool="cut";toolsState();drawTracks()}else if(e.key==="v"||e.key==="V"){TL.tool="sel";toolsState();drawTracks()}
    else if(e.key==="ArrowLeft"){seek(TL.time-1/fpsOf()*(e.shiftKey?10:1))}else if(e.key==="ArrowRight"){seek(TL.time+1/fpsOf()*(e.shiftKey?10:1))}
    else if(e.key==="+"||e.key==="="){TL.pps=Math.min(160,TL.pps*1.25);$("tZoom").value=TL.pps;drawTracks()}else if(e.key==="-"){TL.pps=Math.max(4,TL.pps/1.25);$("tZoom").value=TL.pps;drawTracks()}}}
function toolsState(){const T=$("tlTools");if(!T)return;T.querySelectorAll("[data-tool]").forEach(b=>b.setAttribute("aria-pressed",String(TL.tool===b.dataset.tool)));
  $("tUndo").disabled=!TL.hist.length;$("tRedo").disabled=!TL.fut.length;$("tSnap").setAttribute("aria-pressed",String(TL.snap))}

function itemDown(e,el){e.preventDefault();const k=el.dataset.k,i=+el.dataset.i,K=k==="voz"?"segmentos":k;const arr=items(K);const it=arr[i];
  const r=el.getBoundingClientRect(),x=e.clientX-r.left,tAt=it.t+x/TL.pps;
  if(TL.tool==="cut"){push();split(K,i,snapT(tAt));commit();return}
  if(!TL.sel||TL.sel.k!==K||TL.sel.i!==i)select(K,i);
  const edge=x<8?"l":(r.width-x<8?"r":null);const orig=JSON.parse(JSON.stringify(it));const x0=e.clientX;let moved=false,idx=i;const snap0=JSON.stringify(PLAN);
  const mv=ev=>{const dx=(ev.clientX-x0)/TL.pps;if(!moved&&Math.abs(ev.clientX-x0)<3)return;if(!moved){moved=true;TL.dragging=true}
    const cur=items(K)[idx];
    if(K==="segmentos"){if(edge==="l"){cur.entrada=r4(Math.max(0,Math.min(orig.salida-.1,orig.entrada+dx)))}else if(edge==="r"){cur.salida=r4(Math.max(orig.entrada+.1,Math.min(clipDur(orig.clip),orig.salida+dx)))}
      else{const pt=(ev.clientX-$("tlc").getBoundingClientRect().left)/TL.pps;const segs=PLAN.segmentos;const j=segs.findIndex(s=>pt>=s.t&&pt<s.t+s.dur);
        if(j>=0&&j!==idx){const [m]=segs.splice(idx,1);segs.splice(j,0,m);idx=j;TL.sel={k:K,i:j}}}
      ripple()}
    else if(!edge){cur.t=r4(Math.max(0,snapT(orig.t+dx,cur)));}
    else if(edge==="l"){let nt=snapT(orig.t+dx,cur);let d=nt-orig.t;d=Math.min(d,orig.dur-.1);if((K==="musica"||K==="sfx"))d=Math.max(d,-(orig.desde||0));d=Math.max(d,-orig.t);
      cur.t=r4(orig.t+d);cur.dur=r4(orig.dur-d);if(K==="musica"||K==="sfx")cur.desde=r4((orig.desde||0)+d)}
    else{cur.dur=r4(Math.max(.1,snapT(orig.t+orig.dur+dx,cur)-orig.t))}
    drawTracks();if(K==="segmentos"&&edge)monShow(Math.min(PLAN.duracion,cur.t+(edge==="l"?0:cur.dur-.01)))};
  const up=()=>{removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);TL.dragging=false;
    if(moved){TL.hist.push(snap0);TL.fut=[];commit()}else drawWaves()};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up)}
function split(k,i,t){const arr=items(k),x=arr[i];const off=r4(t-x.t);if(off<.05||off>x.dur-.05)return;
  const b=JSON.parse(JSON.stringify(x));b.id=nid();
  if(k==="segmentos"){x.salida=r4(x.entrada+off);b.entrada=x.salida}
  else{x.dur=off;b.t=r4(x.t+off);b.dur=r4(b.dur-off);if(k==="musica"||k==="sfx"){x.fade_out=Math.min(x.fade_out||0,.03);b.fade_in=.03;b.desde=r4((b.desde||0)+off)}}
  arr.splice(i+1,0,b);TL.sel={k,i:i+1}}
function removeSel(){if(!TL.sel)return;push();items(TL.sel.k).splice(TL.sel.i,1);TL.sel=null;commit()}
function seek(t){TL.time=Math.max(0,Math.min(PLAN.duracion||0,t));movePH();if(!TL.playing)monShow(TL.time);keepVisible()}
function keepVisible(){const sc=$("tls");if(!sc)return;const x=TL.time*TL.pps;if(x<sc.scrollLeft+20||x>sc.scrollLeft+sc.clientWidth-40)sc.scrollLeft=x-sc.clientWidth*.3}

function inspector(){const box=$("insp");if(!box||!PLAN)return;const s=TL.sel?items(TL.sel.k)[TL.sel.i]:null;
  const num=(f,l,v,st=.01)=>`<label class="lab">${l}<input type="number" step="${st}" data-f="${f}" value="${v??""}"></label>`;

    ${sg("zoom",[[1,"Encuadre normal"],[1.12,"Zoom 112%"]],s.zoom??1)}
    <h4>Audio</h4>${rng("vol_db","Volumen",s.vol_db??0,-24,12,1," dB")}${tog("mute","Silenciar este clip",s.mute)}
    <h4>Color</h4><label class="lab">LUT de este clip${lookSel("color.lut",c?.lut||"","Automático (capa o perfil)")}</label>${c?.lut?rng("color.intensidad","Intensidad",c.intensidad??100,0,100,1,"%"):""}`}
  else if(k==="musica"||k==="sfx"){h=`<h4>${k==="musica"?"Música":"Efecto"}${del}</h4><p class="note" style="overflow-wrap:anywhere">${esc(s.tema||s.archivo)}</p>
    <div class="kv">${num("t","Empieza en (s)",s.t)}${num("dur","Dura (s)",s.dur)}</div>${num("desde","Desde el segundo del tema",s.desde||0)}
    ${rng("nivel_db","Volumen",s.nivel_db??(k==="sfx"?-14:-10),-40,0,1," dB")}${rng("fade_in","Fade de entrada",s.fade_in||0,0,8,.1," s")}${rng("fade_out","Fade de salida",s.fade_out||0,0,8,.1," s")}${tog("mute","Silenciar",s.mute)}`}

     :s.tipo==="lugar_hora"?`<div class="kv"><label class="lab">Lugar<input type="text" data-f="lugar" value="${esc(s.lugar)}"></label><label class="lab">Hora<input type="text" data-f="hora" value="${esc(s.hora)}"></label></div>`
     :`<label class="lab">Texto<textarea data-f="texto">${esc(s.texto)}</textarea></label><div class="lab">Estilo${sg("estilo",[["simple","Simple"],["titulo","Neón"],["lugar","Chico"]],s.estilo||"simple")}</div><div class="lab">Posición${sg("pos",[["arriba","Arriba"],["centro","Centro"],["abajo","Abajo"]],s.pos||"abajo")}</div>`)
     +`<div class="kv">${num("t","Aparece en (s)",s.t)}${num("dur","Dura (s)",s.dur)}</div>${tog("oculto","Ocultar",s.oculto)}`}
  else if(k==="capas_color"){h=`<h4>Capa de color${del}</h4><label class="lab">Look${lookSel("lut",s.lut)}</label>${rng("intensidad","Intensidad",s.intensidad??100,0,100,1,"%")}<div class="kv">${num("t","Empieza en (s)",s.t)}${num("dur","Dura (s)",s.dur)}</div><p class="note">Se aplica a los clips que arrancan dentro de la capa. Un clip con LUT propia le gana.</p>`}
  box.innerHTML=h;
  const setF=(f,v)=>{if(f.startsWith("color.")){const kk=f.slice(6);if(kk==="lut"){s.color=v?{lut:v,intensidad:s.color?.intensidad??100}:null}else{s.color??={lut:"",intensidad:100};s.color[kk]=v}}else s[f]=v;
    if(k==="capas_color"&&f==="lut"){s.nombre=(PERFIL?.looks||[]).find(l=>l.archivo===v)?.nombre||fname(v)}};
  box.onfocusin=box.onpointerdown=()=>{TL.pre??=JSON.stringify(PLAN)};
  const done=()=>{if(TL.pre){TL.hist.push(TL.pre);TL.fut=[];TL.pre=null}commit()};
  box.querySelectorAll("[data-f]").forEach(el=>{const f=el.dataset.f;
    el.oninput=()=>{let v=el.type==="checkbox"?el.checked:el.type==="number"||el.type==="range"?+el.value:el.value;
      if(el.type==="range"){const o=box.querySelector(`[data-o="${f}"]`);if(o)o.textContent=v+el.dataset.u}

function audioModal(kind){const m=document.createElement("div");m.className="modal";const prev=kind==="musica"?(V.musica.temas||[]).map(t=>t.archivo):[...new Set((PLAN.sfx||[]).map(x=>x.archivo))];

    push();const base={id:nid(),t:r4(TL.time),dur:r4(dur),desde:0,fade_in:kind==="musica"?.5:0,fade_out:kind==="musica"?3:0};
    if(kind==="musica")PLAN.musica.push({...base,tema:p,nivel_db:-10});else PLAN.sfx.push({...base,archivo:p,nivel_db:-14});close();commit();select(kind,PLAN[kind].length-1)};

/* ---------- monitor ---------- */
const MON={g:null,video:null,clip:null,lutKey:null,cur:null,audios:{},raf:0,last:0};
function monInit(){MON.g=makeGL($("mcv"));MON.clip=null;MON.lutKey=null;stopAudios();MON.audios={};
  if(!MON.video){MON.video=document.createElement("video");MON.video.crossOrigin="anonymous";MON.video.playsInline=true;MON.video.preload="auto"}
  if(!SERVER||!MON.g){$("mph").hidden=false}}
function segAt(t){const S=PLAN.segmentos;let lo=0,hi=S.length-1;while(lo<=hi){const m=(lo+hi)>>1;if(t<S[m].t)hi=m-1;else if(t>=S[m].t+S[m].dur)lo=m+1;else return m}return S.length?Math.min(S.length-1,Math.max(0,lo)):-1}
function effColor(s){if(s.color?.lut)return s.color;const c=(PLAN.capas_color||[]).find(c=>s.t>=c.t-1e-4&&s.t<c.t+c.dur);if(c)return{lut:c.lut,intensidad:c.intensidad??100};const l=V.color.looks?.[s.perfil];return l?.lut?{lut:l.lut,intensidad:l.intensidad??100}:null}
async function setMonLut(s){const c=effColor(s);const key=c?c.lut+"|"+c.intensidad:"";if(key===MON.lutKey)return;MON.lutKey=key;
  if(!c){MON.g?.setLut(null);MON.amt=1;return}try{const l=await lutOf({archivo:c.lut});if(MON.lutKey===key){MON.g.setLut(l);MON.amt=(c.intensidad??100)/100;monDraw()}}catch(e){}}
function monDraw(){if(MON.g)MON.g.draw(MON.amt??1,0)}
function overlays(t,s){const ov=$("mov");if(!ov)return;let h="";
  const bf=V.color.barras?.formato;if(bf&&s&&(V.color.barras.donde==="todo"||["teaser","montaje"].includes(s.tipo))){const r=parseFloat(bf);const hh=(1-(16/9)/r)/2*100;if(hh>0)h+=`<div class="bar t" style="height:${hh}%"></div><div class="bar b" style="height:${hh}%"></div>`}
  for(const x of PLAN.textos||[]){if(x.oculto||t<x.t||t>=x.t+x.dur)continue;
    if(x.tipo==="titulo")h+=`<div class="tx titulo p-centro"><small style="display:block;font-size:.55em">#${esc(x.numero||"")}</small>${esc(x.texto||"")}</div>`;
    else if(x.tipo==="lugar_hora")h+=`<div class="lh"><span>${esc(x.lugar||"")}</span><span>${esc(x.hora||"")}</span></div>`;
    else h+=`<div class="tx ${x.estilo||"simple"} p-${x.pos||"abajo"}">${esc(x.texto||"")}</div>`}
  ov.innerHTML=h}
function placeholder(s){const ph=$("mph");if(!ph)return;const col={teaser:"#b8583a",montaje:"#6a5bc2",cierre:"#3f7a4f",charla:"#55534d"};ph.hidden=false;ph.style.background=s?col[s.tipo]||"#333":"#111";
  ph.innerHTML=s?`${esc(fname(s.clip))}<br>${s.tipo} · ${(s.entrada+(TL.time-s.t)).toFixed(2)} s${SERVER?"":"<br><small style='opacity:.7'>vista previa: en tu Mac se ven los clips</small>"}`:"Sin clips"}
async function monShow(t){if(!PLAN||!$("mcv"))return;const i=segAt(t);const s=PLAN.segmentos[i];overlays(t,s);movePH();
  if(!s||!SERVER||!MON.g)return placeholder(s);$("mph").hidden=true;
  const src=Store.media(abs(s.clip));const v=MON.video;
  if(MON.clip!==s.clip){MON.clip=s.clip;v.src=src;await new Promise(r=>{v.onloadeddata=r;v.onerror=r;setTimeout(r,4000)})}
  if(v.error){$("mph").hidden=false;$("mph").textContent="El navegador no puede mostrar este clip (H.265 10-bit). El render sí lo usa.";return}
  setMonLut(s);v.currentTime=Math.max(0,s.entrada+(t-s.t));await new Promise(r=>{v.onseeked=r;setTimeout(r,1500)});
  if(segAt(TL.time)===i&&!TL.playing){MON.g.setImage(v);monDraw()}}
function togglePlay(){TL.playing?stopPlay():startPlay()}
function startPlay(){if(!PLAN?.segmentos.length)return;if(TL.time>=PLAN.duracion-.05)TL.time=0;TL.playing=true;$("tPlay").textContent="❚❚";MON.last=performance.now();MON.cur=null;
  if(SERVER&&MON.g)playSeg();cancelAnimationFrame(MON.raf);MON.raf=requestAnimationFrame(loop)}
function stopPlay(){TL.playing=false;$("tPlay")&&($("tPlay").textContent="▶");cancelAnimationFrame(MON.raf);MON.video?.pause();stopAudios();if($("mcv"))monShow(TL.time)}
async function playSeg(){const i=segAt(TL.time);const s=PLAN.segmentos[i];if(!s)return stopPlay();MON.cur=i;const v=MON.video;
  if(MON.clip!==s.clip){MON.clip=s.clip;v.src=Store.media(abs(s.clip));await new Promise(r=>{v.onloadeddata=r;v.onerror=r;setTimeout(r,4000)})}
  setMonLut(s);v.currentTime=s.entrada+(TL.time-s.t);vozVol(s);$("mph").hidden=!v.error;try{await v.play()}catch(e){}}
function vozVol(s){const allMute=PLAN.segmentos.every(x=>x.mute);MON.video.volume=s.mute||allMute?0:Math.min(1,db2g(s.vol_db||0)*.85)}
function loop(now){if(!TL.playing||!$("mcv"))return;const dt=(now-MON.last)/1000;MON.last=now;
  if(SERVER&&MON.g&&MON.cur!=null){const s=PLAN.segmentos[MON.cur];const v=MON.video;
    if(s&&v.readyState>=2&&!v.seeking){TL.time=s.t+(v.currentTime-s.entrada);MON.g.setImage(v);monDraw()}
    if(s&&(v.currentTime>=s.salida-.02||v.ended)){const n=PLAN.segmentos[MON.cur+1];if(!n){TL.time=PLAN.duracion;return stopPlay()}
      if(n.clip===s.clip&&Math.abs(n.entrada-v.currentTime)<.08){MON.cur++;setMonLut(n);vozVol(n)}else{TL.time=n.t;v.pause();playSeg()}}}
  else{TL.time+=dt;if(TL.time>=PLAN.duracion){TL.time=PLAN.duracion;return stopPlay()}placeholder(PLAN.segmentos[segAt(TL.time)])}
  overlays(TL.time,PLAN.segmentos[segAt(TL.time)]);movePH();keepVisible();audios(TL.time);MON.raf=requestAnimationFrame(loop)}
function env(c,t){const r=t-c.t,left=c.t+c.dur-t;let g=1;if(c.fade_in>0&&r<c.fade_in)g*=r/c.fade_in;if(c.fade_out>0&&left<c.fade_out)g*=Math.max(0,left/c.fade_out);return Math.max(0,Math.min(1,g))}
function audios(t){if(!SERVER)return;for(const[k,base]of [["musica",10],["sfx",14]])for(const c of PLAN[k]||[]){const path=c.tema||c.archivo;const inside=!c.mute&&t>=c.t&&t<c.t+c.dur;let a=MON.audios[c.id];
  if(inside){if(!a){a=MON.audios[c.id]=new Audio(Store.media(path));a.preload="auto"}if(a.paused){a.currentTime=(c.desde||0)+(t-c.t);a.play().catch(()=>{})}a.volume=Math.min(1,db2g((c.nivel_db??-base)+base)*.8)*env(c,t)}
  else if(a&&!a.paused)a.pause()}}
function stopAudios(){Object.values(MON.audios||{}).forEach(a=>a.pause())}

/* ---------- exportar ---------- */
async function exportar(preview){if(!SERVER||PLAN._demo)return macModal("Exportar necesita la app de tu Mac.");clearTimeout(tlSaveT);await post("/api/plan",{carpeta:V.carpeta,plan:PLAN});
  let d;try{d=await post("/api/render",{carpeta:V.carpeta,preview})}catch(e){return toast(e.message)}TL.job=d.job;const st=$("tlStatus");st.textContent="Exportando…";["tExpP","tExpF"].forEach(id=>$(id).disabled=true);
  const es=new EventSource("/api/claude/eventos?job="+d.job);es.onmessage=e=>{const ev=JSON.parse(e.data);if($("tlStatus"))$("tlStatus").textContent=ev.texto||"";
    if(ev.tipo==="fin"){toast(ev.ok?"Listo: versión nueva en Exportar":"El export falló: mirá el detalle abajo");if($("tlStatus"))$("tlStatus").textContent=ev.ok?"✓ "+ev.texto:"✗ "+ev.texto}};
  const end=()=>{es.close();TL.job=null;["tExpP","tExpF"].forEach(id=>$(id)&&($(id).disabled=false));refresh()};es.addEventListener("fin",end);es.onerror=end}

/* ---------- arranque ---------- */
(async()=>{
  try{const r=await fetch("/api/estado");if(r.ok){const d=await r.json();SERVER=!!d.servidor;CLAUDE=d.claude}}catch(e){}
  try{PERFILES=await Store.perfiles()}catch(e){PERFILES=[structuredClone(SEED)]}
  setPerfil(PERFILES.find(p=>p.id===ls.get("perfil"))||PERFILES[0]);
  const last=ls.get("view");if(last==="editor"&&ls.get("ultimo")){await abrirProyecto(ls.get("ultimo"));if(V)return}
  go(["inicio","proyectos","looks","perfil"].includes(last)?last:"inicio")})();
</script>
