<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Editor de Vlogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Big+Shoulders+Display:wght@800&display=swap">
<style>
/* Tres columnas: pestanas del proceso | trabajo | panel de Claude. Calido y sobrio, inspirado en la estetica de Claude. */
:root{
  --bg:#F5F4EE; --surface:#FFFFFF; --surface-2:#EFEDE4; --ink:#1F1E1D; --ink-2:#6B6A64; --line:#E2DFD3;
  --accent:#C96442; --accent-ink:#FFFFFF; --accent-soft:rgba(201,100,66,.12);
  --violet:#7A68D8; --violet-soft:rgba(122,104,216,.12);
  --ok:#4E8A5E; --warn:#B7791F; --err:#B4432F;
  --f-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-title:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#262624; --surface:#30302E; --surface-2:#1F1E1D; --ink:#FAF9F5; --ink-2:#A8A59B; --line:#3D3D39;
  --accent:#D97757; --accent-soft:rgba(217,119,87,.16); --violet:#9F90F0; --violet-soft:rgba(159,144,240,.16);
  --ok:#6FB57F; --warn:#D9A440; --err:#E07A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --surface-2:#1F1E1D; --ink:#FAF9F5; --ink-2:#A8A59B; --line:#3D3D39;
  --accent:#D97757; --accent-soft:rgba(217,119,87,.16); --violet:#9F90F0; --violet-soft:rgba(159,144,240,.16);
  --ok:#6FB57F; --warn:#D9A440; --err:#E07A63; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr) 360px;height:100%}
@media (max-width:1180px){.shell{grid-template-columns:220px minmax(0,1fr)}.claude{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);height:auto}}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr);height:auto}.nav{position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.nav .brand,.nav .navfoot{display:none}.nav ol{display:flex;gap:4px}.tab{white-space:nowrap}}

/* nav */
.nav{display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface-2);overflow:auto}
.brand{display:grid;gap:2px;padding:0 8px}
.brand b{font:600 22px/1.1 var(--f-serif);letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--ink-2)}
.brand span i{font-style:normal;color:var(--violet)}
.nav ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tab{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:0;background:transparent;border-radius:10px;cursor:pointer;text-align:left;font-weight:500;font-size:14.5px}
.tab .n{font:500 11px var(--f-mono);color:var(--ink-2);text-align:center}
.tab:hover{background:var(--surface)}
.tab[aria-current=page]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.pend{background:var(--accent)}
.navfoot{margin-top:auto;padding:0 8px;font-size:12px;color:var(--ink-2);display:grid;gap:6px}
.navfoot code{font:11.5px var(--f-mono);word-break:break-all}

/* main */
main{overflow:auto;min-width:0}
.page{max-width:980px;margin:0 auto;padding-block:28px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:22px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
h1{font:500 34px/1.15 var(--f-serif);letter-spacing:-.015em;margin:2px 0 0;text-wrap:balance}
.lede{color:var(--ink-2);max-width:62ch;margin:6px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;min-width:0}
.card h2{font:600 15px var(--f-sans);margin:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2 small{font:400 12.5px var(--f-sans);color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:grid;gap:6px}
.field>span{font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.title-input{font:500 26px/1.2 var(--f-serif);padding:12px 14px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg);display:inline-flex;gap:8px;align-items:center}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:4px 0}
.sw>div{display:grid}
.sw b{font-weight:500}
.sw small{color:var(--ink-2);font-size:13px}
.toggle{appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(18px)}
.slider{display:grid;gap:6px}
.slider .top{display:flex;justify-content:space-between;font-size:13.5px}
.slider .top span{color:var(--ink-2)}
.slider .top b{font:500 13px var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:13px;color:var(--ink-2);margin:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.pill{font:500 11.5px var(--f-mono);padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.v{background:var(--violet-soft);color:var(--violet)}
.pill.a{background:var(--accent-soft);color:var(--accent)}
.pill.o{background:rgba(78,138,94,.14);color:var(--ok)}

/* material */
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid}
.clip.off{opacity:.45}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#3a3a37,#1f1e1d);position:relative;display:grid;place-items:center;color:#bbb;font:12px var(--f-mono)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ord{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font:500 11px var(--f-mono);padding:2px 7px;border-radius:6px}
.thumb .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font:500 11px var(--f-mono);padding:2px 7px;border-radius:6px}
.clip .body{padding:10px 12px;display:grid;gap:8px}
.clip .name{font:500 13px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip select{padding:6px 8px;font-size:13px}
.clip .acts{display:flex;gap:6px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.mini[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* historia */
.timeline{display:flex;gap:4px;height:40px;border-radius:10px;overflow:hidden}
.timeline div{display:grid;place-items:center;font:500 11px var(--f-mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.blocks{display:grid;gap:8px}
.block{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.block .k{font:500 11.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em}
.k.teaser{color:var(--accent)}.k.montaje{color:var(--violet)}.k.charla{color:var(--ink-2)}.k.cierre{color:var(--ok)}

/* color */
.viewer{display:grid;gap:10px}
.stage{position:relative;background:#000;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:10px;touch-action:none;cursor:ew-resize;user-select:none}
.stage canvas{width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;background:#000;pointer-events:none}.bar.t{top:0}.bar.b{bottom:0}
.split{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
.split::after{content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.stag{position:absolute;top:10px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:6px;pointer-events:none}
.stag.l{left:10px}.stag.r{right:10px}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip button{flex:none;width:120px;aspect-ratio:16/9;border-radius:8px;border:2px solid transparent;padding:0;overflow:hidden;cursor:pointer;background:#222;color:#bbb;font:11px var(--f-mono)}
.strip button[aria-pressed=true]{border-color:var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.luts{display:grid;gap:6px}
.lut{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left}
.lut[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.lut i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.lut[aria-pressed=true] i{background:var(--accent)}
.lut small{font:11px var(--f-mono);color:var(--ink-2)}
.bigpct{font:500 40px/1 var(--f-serif)}

/* textos */
.frame{aspect-ratio:16/9;border-radius:10px;overflow:hidden;position:relative;background:radial-gradient(120% 90% at 30% 20%,#2c3a3a,#0d0f10 70%);display:grid;place-items:center}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:860px){.frames{grid-template-columns:minmax(0,1fr)}}
.frame.talk{background:radial-gradient(120% 90% at 70% 30%,#5a4a3a,#151210 70%)}
.frame small.cap{position:absolute;top:10px;left:12px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.neon{text-align:center;padding:0 8%;font:800 clamp(22px,3.6vw,46px)/1 var(--f-title);color:#ff4a3d;letter-spacing:.02em;text-shadow:0 0 6px rgba(255,74,61,.9),0 0 24px rgba(255,74,61,.6),0 0 60px rgba(255,74,61,.35);text-transform:uppercase}
.neon small{display:block;text-align:center;font-size:.55em;margin-bottom:.15em}
.sub{position:absolute;bottom:8%;left:0;right:0;text-align:center;color:#fff;font:400 clamp(11px,1.6vw,15px) var(--f-sans);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.place{position:absolute;top:46%;left:6%;right:6%;display:flex;justify-content:space-between;color:#fff;font:400 clamp(11px,1.5vw,14px) var(--f-sans)}

/* exportar */
.vers{display:grid;gap:10px}
.ver{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
video{width:100%;border-radius:10px;background:#000;max-width:100%}
.notes{display:grid;gap:8px}
.notei{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.notei input{padding:8px 10px}

/* panel claude */
.claude{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;height:100%;min-width:0}
.ch{padding:18px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.ch h3{margin:0;font:500 20px var(--f-serif);display:flex;align-items:center;gap:10px}
.spark{width:22px;height:22px;border-radius:7px;background:var(--violet);display:grid;place-items:center;color:#fff;font:700 13px var(--f-sans)}
.conn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.conn.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(78,138,94,.18)}
.conn.off i{background:var(--warn)}
.feed{flex:1;overflow:auto;padding:14px 18px;display:grid;align-content:start;gap:10px;min-height:160px}
.ev{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.45}
.ev i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--line)}
.ev.texto i{background:var(--violet)}.ev.paso i,.ev.fin_paso i{background:var(--accent)}.ev.paso,.ev.fin_paso{font:12px/1.45 var(--f-mono)}.ev.fin i{background:var(--ok)}.ev.error i{background:var(--err)}
.ev.herramienta{color:var(--ink-2);font:12px/1.45 var(--f-mono)}
.ev.herramienta span{overflow-wrap:anywhere}
.ev.texto span{white-space:pre-wrap}
.ev.error span{color:var(--err)}
.cf{padding:14px 18px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.quick button:hover{border-color:var(--violet);color:var(--violet)}
.cf textarea{min-height:64px;background:var(--bg)}
.go{width:100%;justify-content:center;padding:12px;font-size:15px}
.running .go{background:var(--violet)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Pasos de la edición">
    <div class="brand"><b>Editor de Vlogs</b><span>con <i>Claude Code</i></span></div>
    <ol id="tabs"></ol>
    <div class="navfoot"><span>Carpeta</span><code id="footFolder">sin elegir</code></div>
  </nav>
  <main id="main"><div class="page" id="page"></div></main>
  <aside class="claude" id="claude">
    <div class="ch">
      <h3><span class="spark" aria-hidden="true">C</span>Claude</h3>
      <div class="conn" id="conn"><i></i><span>Buscando Claude Code…</span></div>
    </div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="cf">
      <div class="quick" id="quick"></div>
      <textarea id="pedido" placeholder="Pedile algo a Claude. Ej: editá el vlog completo y exportá una preview."></textarea>
      <button class="btn accent go" id="go" type="button">Editar con Claude</button>
      <button class="btn ghost" id="stop" type="button" hidden>Parar</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=s=>{s=Math.round(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

/* ---------- estado ---------- */
const DEFAULT={version:1,titulo:"",carpeta:"",fecha:new Date().toISOString().slice(0,10),
  material:{clips:[]},
  historia:{teaser:{activo:true,duracion_s:20},capitulos_lugar_hora:true,notas:"",bloques:[]},
  cortes:{silencio_max_s:.25,muletillas:true,correcciones:true,punch_in:true,agresividad:"normal"},
  color:{looks:{dlog:{lut:"Powergrade/D-Log/MA_Vivo_DLog_DIA.cube",intensidad:100},dlog2:{lut:"",intensidad:100},rec709:{lut:"",intensidad:100}},barras:{formato:"2.22:1",donde:"montajes"}},
  audio:{fuente_voz:"auto",reducir_ruido:true,ambiente_montajes_db:-18},
  musica:{temas:[],en_charla:"nada",fade_s:4,corte_en_beat:true,volumen_montaje_db:-10},
  textos:{subtitulos:true,titulo_episodio:{activo:true,numero:"1",texto:""},lugar_hora:true},
  exportar:{resolucion:"1080p",lufs:-14,preview:true},
  revision:{notas:[]},estado:{paso:"",versiones:[]}};
const merge=(a,b)=>{if(Array.isArray(a)||typeof a!=="object"||a===null)return b===undefined?a:b;const o={...a};for(const k in b||{})o[k]=k in a?merge(a[k],b[k]):b[k];return o};
let V=structuredClone(DEFAULT), SERVER=false, CLAUDE=null, TAB="vlog", JOB=null, es=null;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function get(path){return path.split(".").reduce((o,k)=>o?.[k],V)}
function set(path,val){const ks=path.split(".");let o=V;ks.slice(0,-1).forEach(k=>{o[k]??={};o=o[k]});o[ks.at(-1)]=val;save();renderNav()}
let saveT;
function save(){ls.set("vlog_borrador",V);clearTimeout(saveT);saveT=setTimeout(async()=>{
  if(!SERVER||!V.carpeta)return;
  try{const r=await fetch("/api/vlog",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({carpeta:V.carpeta,vlog:V})});
    if(!r.ok)toast((await r.json()).error||"No se pudo guardar")}catch(e){toast("No se pudo guardar")}},500)}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const media=p=>SERVER?"/media?p="+encodeURIComponent(p):"";
const abs=rel=>rel&&rel.startsWith("/")?rel:(V.carpeta?V.carpeta.replace(/\/$/,"")+"/"+rel:rel);

/* ---------- componentes ---------- */
function seg(path,opts){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${path}" data-v='${JSON.stringify(v)}' aria-pressed="${JSON.stringify(get(path))===JSON.stringify(v)}">${l}</button>`).join("")}</div>`}
function sw(path,title,sub){return `<label class="sw"><div><b>${title}</b>${sub?`<small>${sub}</small>`:""}</div><input type="checkbox" class="toggle" data-sw="${path}" ${get(path)?"checked":""}></label>`}
const FMT={};
function sl(path,title,min,max,step,fmt){FMT[path]=fmt;const v=get(path);return `<div class="slider"><div class="top"><span>${title}</span><b data-out="${path}">${fmt(v)}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-sl="${path}" aria-label="${title}"></div>`}
function fld(path,label,ph,cls=""){return `<label class="field"><span>${label}</span><input type="text" class="${cls}" data-txt="${path}" value="${esc(get(path))}" placeholder="${esc(ph)}"></label>`}
function wire(root){
  root.querySelectorAll("[data-seg]").forEach(b=>b.onclick=()=>{set(b.dataset.seg,JSON.parse(b.dataset.v));b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));onChange(b.dataset.seg)});
  root.querySelectorAll("[data-sw]").forEach(i=>i.onchange=()=>{set(i.dataset.sw,i.checked);onChange(i.dataset.sw)});
  root.querySelectorAll("[data-sl]").forEach(i=>{const f=FMT[i.dataset.sl];i.oninput=()=>{const v=+i.value;root.querySelector(`[data-out="${i.dataset.sl}"]`).textContent=f(v);set(i.dataset.sl,v);onChange(i.dataset.sl)}});
  root.querySelectorAll("[data-txt]").forEach(i=>i.oninput=()=>{set(i.dataset.txt,i.value);onChange(i.dataset.txt)});
}
let onChange=()=>{};

/* ---------- pestañas ---------- */
const TABS=[
 ["vlog","Vlog",()=>V.titulo&&V.carpeta],
 ["material","Material",()=>V.material.clips.length>0],
 ["historia","Historia",()=>V.historia.bloques?.length>0],
 ["cortes","Cortes",()=>true],
 ["color","Color",()=>Object.values(V.color.looks).some(l=>l.lut)],
 ["audio","Audio",()=>true],
 ["musica","Música",()=>V.musica.temas.length>0],
 ["textos","Textos",()=>true],
 ["exportar","Exportar",()=>V.estado.versiones?.length>0],
];
function renderNav(){$("tabs").innerHTML=TABS.map(([k,l,ok],i)=>`<li><button class="tab" type="button" data-tab="${k}" ${TAB===k?'aria-current="page"':""}><span class="n">${i}</span><span>${l}</span><i class="dot ${ok()?"ok":"pend"}"></i></button></li>`).join("");
  $("tabs").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
  $("footFolder").textContent=V.carpeta||"sin elegir"}
function go(t){TAB=t;ls.set("tab",t);renderNav();render();$("main").scrollTop=0}
function head(i,title,lede){return `<div><div class="eyebrow">Paso ${i} de 8</div><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</div>`}
function render(){onChange=()=>{};stopViewer();const P=$("page");P.innerHTML=VIEWS[TAB]();wire(P);AFTER[TAB]?.(P)}

const VIEWS={
vlog:()=>`${head(0,"El vlog","El título le da la dirección al video: con eso Claude decide qué contar primero y qué tomas pesan más.")}
 <div class="card">${fld("titulo","Título","Ej: Un día cerrando clientes en Madrid","title-input")}

 <div class="row"><button class="btn accent" type="button" id="scan">${V.material.clips.length?"Volver a escanear":"Escanear carpeta"}</button><span class="note">${V.material.clips.length?`${V.material.clips.length} clips · ${mmss(V.material.clips.reduce((a,c)=>a+(c.descartado?0:c.duracion||0),0))} útiles`:""}</span></div>
 ${V.material.clips.length?`<div class="clips">${V.material.clips.map((c,i)=>`<div class="clip ${c.descartado?"off":""}">

 const col={teaser:"var(--accent)",montaje:"var(--violet)",charla:"#8a8880",cierre:"var(--ok)"};
 return `${head(2,"Historia","Claude transcribe todo y arma la estructura según el título: avance de apertura, bloques de charla, montajes entre bloques y cierre.")}

  <div class="blocks">${b.map(x=>`<div class="block"><span class="k ${esc(x.tipo)}">${esc(x.tipo)}</span><span>${esc(x.resumen||x.clip)}</span><span class="pill">${mmss(x.salida-x.entrada)}</span></div>`).join("")}</div>`

exportar:()=>{const vs=V.estado.versiones||[];return `${head(8,"Exportar y revisar","Primero una preview liviana para revisar; cuando esté, la final. Las versiones nunca se pisan.")}
 <div class="grid2"><div class="card"><h2>Formato</h2><div class="field"><span>Resolución</span>${seg("exportar.resolucion",[["1080p","1080p"],["4k","4K"]])}</div>${sw("exportar.preview","Empezar con preview","Más rápida, para revisar cortes y música")}<p class="note">16:9 · audio a ${V.exportar.lufs} LUFS (lo que usa YouTube)</p></div>
 <div class="card"><h2>Versiones</h2>${vs.length?`<div class="vers">${vs.map((v,i)=>`<div class="ver"><span><b>${esc(v.archivo.split("/").pop())}</b> <span class="pill ${v.preview?"v":"o"}">${v.preview?"preview":"final"}</span><br><small class="note">${esc((v.fecha||"").replace("T"," ").slice(0,16))}${v.duracion?" · "+mmss(v.duracion):""}${v.nota?" · "+esc(v.nota):""}</small></span><button class="mini" type="button" data-play="${i}">Ver</button></div>`).join("")}</div><video id="player" controls hidden playsinline></video>`
  :`<div class="empty"><b>Sin versiones todavía</b><span>Tocá Editar con Claude para sacar la primera.</span></div>`}</div></div>
 <div class="card"><h2>Notas de revisión <small>Claude las aplica en la próxima versión</small></h2>
  <div class="notes" id="notes">${(V.revision.notas||[]).map((n,i)=>`<div class="notei"><input type="text" value="${esc(n.tc)}" data-nota="${i}" data-k="tc" aria-label="Minuto"><input type="text" value="${esc(n.texto)}" data-nota="${i}" data-k="texto" aria-label="Nota"><span class="pill ${n.hecha?"o":"a"}">${n.hecha?"hecha":"pendiente"}</span><button class="mini" type="button" data-delnota="${i}">Quitar</button></div>`).join("")}</div>
  <div class="row"><button class="btn ghost" type="button" id="addNota">Agregar nota</button><button class="btn ghost" type="button" data-ask="Aplicá las notas de revisión pendientes y exportá una versión nueva.">Aplicar notas con Claude</button></div></div>`}
};

const AFTER={
vlog(P){$("abrir").onclick=async()=>{if(!SERVER)return toast("Abrí la app desde el servidor local para usar tus carpetas");
  if(!V.carpeta)return toast("Escribí la ruta de la carpeta del día");

  $("scan").disabled=true;$("scan").textContent="Escaneando…";await fetch("/api/vlog",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({carpeta:V.carpeta,vlog:V})});
  const r=await fetch("/api/escanear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({carpeta:V.carpeta})});const d=await r.json();
  if(d.vlog){V=merge(DEFAULT,d.vlog);toast(V.material.clips.length+" clips")}else toast(d.error||"No se pudo escanear");renderNav();render()};
  P.querySelectorAll("[data-clip]").forEach(el=>{const c=V.material.clips[el.dataset.clip],k=el.dataset.k;
    if(el.tagName==="SELECT")el.onchange=()=>{c[k]=el.value;save();renderNav()};else el.onclick=()=>{c[k]=!c[k];save();render()}})},
historia(P){wireAsk(P)},
musica(P){$("addTema").onclick=()=>{const v=$("temaPath").value.trim();if(!v)return;V.musica.temas.push({archivo:v,uso:"montajes"});save();renderNav();render()};
  P.querySelectorAll("[data-tema]").forEach(s=>s.onchange=()=>{V.musica.temas[s.dataset.tema].uso=s.value;save()});
  P.querySelectorAll("[data-deltema]").forEach(b=>b.onclick=()=>{V.musica.temas.splice(b.dataset.deltema,1);save();renderNav();render()})},
textos(P){onChange=()=>{$("frame").innerHTML=frameHTML()}},
exportar(P){wireAsk(P);$("addNota").onclick=()=>{V.revision.notas.push({tc:"00:00",texto:"",hecha:false});save();render()};
  P.querySelectorAll("[data-nota]").forEach(i=>i.oninput=()=>{V.revision.notas[i.dataset.nota][i.dataset.k]=i.value;save()});
  P.querySelectorAll("[data-delnota]").forEach(b=>b.onclick=()=>{V.revision.notas.splice(b.dataset.delnota,1);save();render()});
  P.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const v=$("player");v.hidden=false;v.src=media(abs(V.estado.versiones[b.dataset.play].archivo));v.play().catch(()=>{})})},

};

/* ---------- color (WebGL) ---------- */
const LUTS=[
 {perfil:"dlog",name:"MA Vivo · Día",path:"Powergrade/D-Log/MA_Vivo_DLog_DIA.cube"},
 {perfil:"dlog",name:"MA Vivo · Noche",path:"Powergrade/D-Log/MA_Vivo_DLog_NOCHE.cube"},
 {perfil:"dlog",name:"High Ticket",path:"Powergrade/High Ticket/High_Ticket_DLog.cube"},
 {perfil:"dlog2",name:"MA Vivo · Día",path:"Powergrade/D-Log 2 (sin probar)/MA_Vivo_DLog2_DIA.cube"},
 {perfil:"dlog2",name:"MA Vivo · Noche",path:"Powergrade/D-Log 2 (sin probar)/MA_Vivo_DLog2_NOCHE.cube"},
 {perfil:"dlog2",name:"High Ticket",path:"Powergrade/High Ticket/High_Ticket_DLog2.cube"},
 {perfil:"rec709",name:"High Ticket",path:"Powergrade/High Ticket/High_Ticket_Rec709.cube"}];
let GL=null, PERF=ls.get("perf")||"dlog", split=.5, lutCache={};
function stopViewer(){GL=null}
function parseCube(t){let n=0;const v=[];for(const line of t.split(/\r?\n/)){const s=line.trim();if(!s||s[0]=="#")continue;if(/^LUT_3D_SIZE/i.test(s)){n=parseInt(s.split(/\s+/)[1]);continue}if(/^[A-Z_]/i.test(s))continue;const p=s.split(/\s+/);if(p.length>=3)v.push(+p[0],+p[1],+p[2],1)}if(!n||v.length!==n*n*n*4)throw Error("LUT inválida");return{n,data:new Float32Array(v)}}
async function loadLut(path){if(lutCache[path])return lutCache[path];const r=await fetch("repo/"+path.split("/").map(encodeURIComponent).join("/"));if(!r.ok)throw Error("no");return lutCache[path]=parseCube(await r.text())}
function startViewer(P){
  const cv=$("cv"),gl=cv.getContext("webgl2");if(!gl){$("stage").innerHTML='<div class="empty" style="color:#bbb">Este navegador no soporta WebGL2</div>';return}
  const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;uv.y=1.-uv.y;gl_Position=vec4(p,0,1);}`));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;precision highp sampler3D;in vec2 uv;out vec4 o;uniform sampler2D img;uniform sampler3D lut;uniform float n,amt,split,has;
void main(){vec3 c=texture(img,uv).rgb;vec3 g=c;if(has>.5){vec3 q=clamp(c,0.,1.)*(n-1.)/n+.5/n;g=mix(c,texture(lut,q).rgb,amt);}o=vec4(uv.x<split?c:g,1);}`));
  gl.linkProgram(pr);gl.useProgram(pr);
  const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=k=>gl.getUniformLocation(pr,k);
  const ti=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ti);[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
  const tl=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,tl);[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.LINEAR));[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T,gl.TEXTURE_WRAP_R].forEach(k=>gl.texParameteri(gl.TEXTURE_3D,k,gl.CLAMP_TO_EDGE));
  gl.uniform1i(U("img"),0);gl.uniform1i(U("lut"),1);
  let n=0;const me={};GL=me;
  const look=()=>V.color.looks[PERF];
  function draw(){if(GL!==me)return;gl.viewport(0,0,cv.width,cv.height);gl.uniform1f(U("n"),n||1);gl.uniform1f(U("amt"),(look().intensidad??100)/100);gl.uniform1f(U("split"),split);gl.uniform1f(U("has"),n&&look().lut?1:0);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);$("split").style.left=`calc(${split*100}% - 1px)`}
  function bars(){const f=V.color.barras.formato;const r=f?parseFloat(f):0;const ar=cv.width/cv.height;const h=r>ar?(1-ar/r)/2*100:0;$("barT").style.height=$("barB").style.height=h+"%"}
  function setImg(im){cv.width=im.naturalWidth;cv.height=im.naturalHeight;gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ti);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);bars();draw()}
  async function useLut(){n=0;draw();const p=look().lut;if(!p)return;try{const l=await loadLut(p);if(GL!==me)return;gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_3D,tl);gl.texImage3D(gl.TEXTURE_3D,0,gl.RGBA16F,l.n,l.n,l.n,0,gl.RGBA,gl.FLOAT,l.data);n=l.n;draw()}catch(e){toast(SERVER?"No pude leer la LUT":"Las LUTs se cargan con el servidor local")}}
  function loadSrc(url){const im=new Image();im.crossOrigin="anonymous";im.onload=()=>setImg(im);im.src=url}
  // fuentes: miniaturas de los clips del perfil, o la carta de ejemplo
  function strip(){const cs=V.material.clips.filter(c=>c.perfil===PERF&&c.thumb&&!c.descartado);
    $("strip").innerHTML=(cs.length&&SERVER?cs.map((c,i)=>`<button type="button" data-src="${media(abs(c.thumb))}" aria-pressed="${i===0}" title="${esc(c.archivo)}"><img src="${media(abs(c.thumb))}" alt=""></button>`).join(""):`<button type="button" data-src="${CARTA}" aria-pressed="true">Carta D-Log</button>`);
    $("strip").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("strip").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));loadSrc(b.dataset.src)});
    loadSrc($("strip").querySelector("button").dataset.src)}
  function panel(){$("perfSeg").innerHTML=`<div class="seg">${[["dlog","D-Log"],["dlog2","D-Log 2"],["rec709","Rec709"]].map(([k,l])=>`<button type="button" data-p="${k}" aria-pressed="${PERF===k}">${l}</button>`).join("")}</div>`;
    $("perfSeg").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{PERF=b.dataset.p;ls.set("perf",PERF);panel();strip();useLut()});
    const opts=[{name:"Sin LUT",path:""},...LUTS.filter(l=>l.perfil===PERF)];
    $("luts").innerHTML=opts.map(l=>`<button type="button" class="lut" data-lut="${esc(l.path)}" aria-pressed="${(look().lut||"")===l.path}"><i></i><span>${l.name}</span><small>${esc(l.path.split("/").pop())}</small></button>`).join("");
    $("luts").querySelectorAll("[data-lut]").forEach(b=>b.onclick=()=>{look().lut=b.dataset.lut;save();renderNav();panel();useLut()});
    $("amt").value=look().intensidad??100;$("pct").textContent=$("amt").value+"%"}
  $("amt").oninput=e=>{look().intensidad=+e.target.value;$("pct").textContent=e.target.value+"%";save();draw()};
  onChange=k=>{if(k.startsWith("color.barras"))bars()};
  const st=$("stage");const mv=e=>{const r=st.getBoundingClientRect();split=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));draw()};
  st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);mv(e)};st.onpointermove=e=>{if(e.buttons)mv(e)};
  panel();strip();useLut()}

/* ---------- Claude ---------- */
const QUICK=[["Editá todo","Editá el vlog completo y exportá una preview."],["Armá la historia","Transcribí y armá la historia (sin exportar todavía)."],["Exportá la final","Exportá la versión final en la resolución elegida."],["Aplicá las notas","Aplicá las notas de revisión pendientes y exportá una versión nueva."]];
$("quick").innerHTML=QUICK.map(([l,p])=>`<button type="button" data-q="${esc(p)}">${l}</button>`).join("");
$("quick").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{$("pedido").value=b.dataset.q;$("pedido").focus()});
function feed(ev){const el=document.createElement("div");el.className="ev "+ev.tipo;
  const label=ev.tipo==="herramienta"?`${ev.nombre}: ${ev.texto}`:ev.tipo==="fin"?(ev.ok?"Listo. ":"Terminó con problemas. ")+(ev.texto||""):ev.texto;
  el.innerHTML=`<i></i><span>${esc(label)}</span>`;$("feed").appendChild(el);$("feed").scrollTop=$("feed").scrollHeight}
function setConn(){const c=$("conn");
  if(!SERVER){c.className="conn off";c.querySelector("span").textContent="Vista previa · sin servidor local";return}
  if(!CLAUDE){c.className="conn off";c.querySelector("span").textContent="No encontré Claude Code en esta Mac";return}
  c.className="conn on";c.querySelector("span").textContent="Conectado · "+CLAUDE}
async function runClaude(){
  if(!SERVER)return toast("Abrí la app desde el servidor local para usar Claude Code");
  if(!CLAUDE)return toast("Instalá Claude Code y logueate (ver LEEME)");
  if(!V.carpeta)return go("vlog");
  clearTimeout(saveT);await fetch("/api/vlog",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({carpeta:V.carpeta,vlog:V})});
  const pedido=$("pedido").value.trim()||"Editá el vlog completo y exportá una preview.";
  feed({tipo:"texto",texto:"Vos: "+pedido});
  const r=await fetch("/api/claude/editar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({carpeta:V.carpeta,pedido})});
  const d=await r.json();if(!d.job)return feed({tipo:"error",texto:d.error||"No pude lanzar Claude Code"});
  JOB=d.job;$("claude").classList.add("running");$("go").textContent="Claude está trabajando…";$("go").disabled=true;$("stop").hidden=false;
  es=new EventSource("/api/claude/eventos?job="+JOB);
  es.onmessage=e=>{const ev=JSON.parse(e.data);feed(ev);if(ev.tipo==="paso"||ev.tipo==="fin")refresh()};
  es.addEventListener("fin",done);es.onerror=done}
function done(){es&&es.close();es=null;JOB=null;$("claude").classList.remove("running");$("go").textContent="Editar con Claude";$("go").disabled=false;$("stop").hidden=true;refresh()}
async function refresh(){if(!SERVER||!V.carpeta)return;try{const d=await (await fetch("/api/vlog?carpeta="+encodeURIComponent(V.carpeta))).json();if(d.vlog){V=merge(DEFAULT,d.vlog);renderNav();if(TAB!=="color")render()}}catch(e){}}
$("go").onclick=runClaude;
$("stop").onclick=()=>{if(JOB)fetch("/api/claude/parar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({job:JOB})})};
$("pedido").onkeydown=e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))runClaude()};

/* ---------- arranque ---------- */
(async()=>{
  const b=ls.get("vlog_borrador");if(b)V=merge(DEFAULT,b);
  TAB=ls.get("tab")||"vlog";
  try{const r=await fetch("/api/estado");if(r.ok){const d=await r.json();SERVER=!!d.servidor;CLAUDE=d.claude}}catch(e){}
  if(SERVER&&V.carpeta){try{const d=await (await fetch("/api/vlog?carpeta="+encodeURIComponent(V.carpeta))).json();if(d.vlog)V=merge(DEFAULT,d.vlog)}catch(e){}}
  setConn();renderNav();render();
  if(!$("feed").children.length)feed({tipo:"texto",texto:SERVER?"Configurá el vlog en las pestañas y tocá Editar con Claude cuando quieras. Te muestro acá lo que voy haciendo.":"Estás viendo la app sin el servidor local. Podés recorrer las pestañas; para editar, abrila con el servidor (ver LEEME)."});
})();
</script>
